// =================== GOOGLE SHEETS & DRIVE SYNC API ===================
async function apiCall(action, payload={}) {
  const url = db.settings.gasUrl || DEFAULT_GAS_URL;
  if(!url){
    console.warn('ยังไม่ได้ระบุ Google Apps Script Web App URL');
    return null;
  }
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    return await res.json();
  } catch (err) {
    console.error('API Error:', err);
    throw err;
  }
}

/**
 * ดึงข้อมูลสดทั้งหมดจาก Google Sheets มาอัปเดตในระบบ (Cloud Sync)
 * ช่วยให้เปิดในเบราว์เซอร์อื่น หรือเครื่องอื่นแล้วข้อมูลตรงกันทันที 100%
 */
async function fetchCloudData(silent = false){
  const url = db.settings.gasUrl || DEFAULT_GAS_URL;
  if(!url) return;
  if(isSyncingCloud) return;
  isSyncingCloud = true;

  if(!silent){
    Swal.fire({
      title: 'กำลังดึงข้อมูลล่าสุด...',
      text: 'กำลังโหลดข้อมูลจาก Google Sheets',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
  }

  try {
    // ดึงข้อมูลผ่าน action getData
    const res = await apiCall('getData');
    if(res && res.status === 'success' && res.data){
      const d = res.data;
      if(Array.isArray(d.users) && d.users.length) db.users = d.users;
      if(Array.isArray(d.terms) && d.terms.length) db.terms = d.terms;
      if(Array.isArray(d.subjectGroups) && d.subjectGroups.length) db.subjectGroups = d.subjectGroups;
      if(Array.isArray(d.subjects) && d.subjects.length) db.subjects = d.subjects;
      if(Array.isArray(d.levels) && d.levels.length) db.levels = d.levels;
      if(Array.isArray(d.classes) && d.classes.length) db.classes = d.classes;
      if(Array.isArray(d.students) && d.students.length) db.students = d.students;
      if(Array.isArray(d.assessments)) db.assessments = d.assessments;
      if(Array.isArray(d.activityLogs)) db.activityLogs = d.activityLogs;

      if(d.topics && (d.topics.junior || d.topics.senior)){
        if(d.topics.junior) db.topics.junior = d.topics.junior;
        if(d.topics.senior) db.topics.senior = d.topics.senior;
      }

      if(d.settings){
        if(d.settings.logo) db.settings.logo = d.settings.logo;
        if(d.settings.primary) db.settings.primary = d.settings.primary;
        if(d.settings.secondary) db.settings.secondary = d.settings.secondary;
      }

      saveDB();
      applyTheme();
      render();

      if(!silent){
        Swal.close();
        toast('success', 'ซิงค์ข้อมูลล่าสุดจาก Google Sheets สำเร็จ');
      } else {
        console.log('Auto-synced with Google Sheets successfully');
      }
    }
  } catch(err){
    console.warn('Cannot fetch from Google Sheets:', err);
    if(!silent){
      Swal.close();
      Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', 'ไม่สามารถดึงข้อมูลจาก Google Sheets ได้ กรุณาตรวจสอบอินเทอร์เน็ตหรือ URL เว็บแอป', 'error');
    }
  } finally {
    isSyncingCloud = false;
  }
}

// =================== TREE HELPERS ===================
function flattenLeaves(nodes, path=[]){
  let out=[];
  for(const n of nodes){
    const p=[...path, n];
    if(!n.children || n.children.length===0) out.push({node:n, path:p});
    else out=out.concat(flattenLeaves(n.children, p));
  }
  return out;
}
function findNode(nodes, id){
  for(const n of nodes){
    if(n.id===id) return n;
    if(n.children){ const f=findNode(n.children, id); if(f) return f; }
  }
  return null;
}
function findPath(nodes, id, path=[]){
  for(const n of nodes){
    if(n.id===id) return [...path, n];
    if(n.children){ const f=findPath(n.children, id, [...path, n]); if(f) return f; }
  }
  return null;
}
function computeNodeAvg(node, scores){
  if(!node.children || node.children.length===0){
    return scores.has(node.id) ? scores.get(node.id) : null;
  }
  const c = node.children.map(ch => computeNodeAvg(ch, scores)).filter(v => v != null);
  return c.length ? avg(c) : null;
}
function studentScores(studentId, termId, type){
  const scores = new Map();
  const tmp = {};
  db.assessments.filter(a => a.studentId===studentId && a.termId===termId && a.type===type)
    .forEach(a => { (tmp[a.topicId] = tmp[a.topicId] || []).push(a.score); });
  Object.entries(tmp).forEach(([k, v]) => scores.set(k, avg(v)));
  return scores;
}
function studentOverall(studentId, termId, type){
  const scores = studentScores(studentId, termId, type);
  const tree = db.topics[type] || [];
  const roots = tree.map(t => computeNodeAvg(t, scores)).filter(v => v != null);
  return roots.length ? avg(roots) : null;
}

}

function selectAllDashClasses(scope, selectAll){

  else if(scope === 'admin') state.adminSelectedClasses = allIds;
  else state.teacherSelectedClasses = allIds;

function computeClassStats(termId, classIds){
  return classIds.map(cid => {
    const cls = db.classes.find(c => c.id === cid);
    const lv = db.levels.find(l => l.id === cls?.levelId);
    const sts = db.students.filter(s => s.classId === cid);
    const vals = [];
    sts.forEach(s => {
      const v = studentOverall(s.id, termId, lv?.type || 'junior');
      if(v != null) vals.push(v);
    });
    const a = avg(vals);
    return {
      name: cls ? cls.name : '?',
      avg: a != null ? Number(a.toFixed(2)) : 0,
      count: vals.length
    };
  });
}

function kpiCard(title, d){
  return `<div class="card p-5 fade-in text-center border-t-4 border-t-emerald-500">
    <p class="text-xs font-bold text-slate-500 uppercase tracking-wide">${title}</p>
    <div class="mt-2 flex items-baseline gap-2 justify-center">
      <span class="text-3xl font-extrabold text-slate-800">${d.avg != null ? d.avg.toFixed(2) : '-'}</span>
      <span class="text-xs text-slate-400">/ 3.00</span>
    </div>
    <div class="mt-2">${qBadge(d.level, d.avg)}</div>
    <p class="mt-2 text-xs text-slate-400 font-medium">ประเมินแล้ว ${d.count} คน</p>
  </div>`;
}

function computeDashboard(termId){
  const calcLevel = (lt) => {
    const lvIds = db.levels.filter(l => l.type === lt).map(l => l.id);
    const clsIds = db.classes.filter(c => lvIds.includes(c.levelId)).map(c => c.id);
    const sts = db.students.filter(s => clsIds.includes(s.classId));
    const vals = [];
    sts.forEach(s => {
      const v = studentOverall(s.id, termId, lt);
      if(v != null) vals.push(v);
    });
    const a = avg(vals);
    return {avg: a, level: qf(a), count: vals.length};
  };

  const allVals = [];
  const seen = new Set();
  db.students.forEach(s => {
    const vj = studentOverall(s.id, termId, 'junior');
    const vs = studentOverall(s.id, termId, 'senior');
    if(vj != null) allVals.push(vj);
    if(vs != null) allVals.push(vs);
    if(vj != null || vs != null) seen.add(s.id);
  });
  const schoolAvg = avg(allVals);
  const school = {avg: schoolAvg, level: qf(schoolAvg), count: seen.size};

  const byLevel = db.levels.map(l => {
    const clsIds = db.classes.filter(c => c.levelId === l.id).map(c => c.id);
    const sts = db.students.filter(s => clsIds.includes(s.classId));
    const vals = [];
    sts.forEach(s => {
      const v = studentOverall(s.id, termId, l.type);
      if(v != null) vals.push(v);
    });
    return {name: l.name, avg: avg(vals), level: qf(avg(vals)), count: vals.length};
  });

  return {school, junior: calcLevel('junior'), senior: calcLevel('senior'), byLevel};
}

              <button onclick="selectAllDashClasses('admin', false)" class="text-xs text-rose-500 font-semibold hover:underline">ล้างการเลือก</button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            ${db.classes.map(c => `
              <label class="cursor-pointer text-xs font-medium px-2.5 py-1.5 rounded-lg border flex items-center gap-1.5 transition ${state.adminSelectedClasses.includes(c.id)?'bg-emerald-100 border-emerald-400 text-emerald-800 font-bold':'bg-white text-slate-600 border-slate-200'}">
                <input type="checkbox" value="${c.id}" ${state.adminSelectedClasses.includes(c.id)?'checked':''} onchange="toggleDashClass('admin', '${c.id}')" class="rounded text-emerald-600 focus:ring-emerald-500">
                ${esc(c.name)}
              </label>
            `).join('')}
          </div>
        </div>

        <div id="admin-class-chart-wrap">
          ${state.adminSelectedClasses.length === 0 ? `
            <div class="p-10 text-center text-slate-400 border border-dashed rounded-xl bg-slate-50">
              <p class="font-medium text-sm">ยังไม่ได้เลือกชั้นเรียน</p>
              <p class="text-xs mt-1">กรุณาคลิกเลือกห้องเรียนด้านบนเพื่อเปรียบเทียบกราฟค่าเฉลี่ย</p>
            </div>
          ` : `
            <div class="relative h-80"><canvas id="admin-class-chart"></canvas></div>
          `}
        </div>
      </div>
    `;

    renderAdminCharts(termId);
  }, 100);
}

function renderAdminCharts(termId){
  const el = $('#admin-level-chart');
  if(!el) return;
  const data = computeDashboard(termId);

  if(adminLevelChart) adminLevelChart.destroy();
  adminLevelChart = new Chart(el, {
    type: 'bar',
    data: {
      labels: data.byLevel.map(x => x.name),
      datasets: [{label: 'ค่าเฉลี่ย', data: data.byLevel.map(x => x.avg), backgroundColor: db.settings.primary, borderRadius: 8}]
    },
    options: {responsive: true, maintainAspectRatio: false, scales: {y: {beginAtZero: true, max: 3}}}
  });

  const classCanvas = $('#admin-class-chart');
  if(classCanvas && state.adminSelectedClasses.length > 0){
    const classData = computeClassStats(termId, state.adminSelectedClasses);
    if(adminClassChart) adminClassChart.destroy();
    adminClassChart = new Chart(classCanvas, {
      type: 'bar',
      data: {
        labels: classData.map(c => c.name),
        datasets: [{
          label: 'ค่าเฉลี่ยสมรรถนะห้องเรียน',
          data: classData.map(c => c.avg),
          backgroundColor: '#0284c7',
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 3, ticks: { stepSize: 0.5 } } }
      }
    });
  }
}

// ---- หน้ากิจกรรมครู (Activity Logs) แสดงทีละ 10 ล่าสุดอยู่อันแรก ----

      </div>
      ${logs.length > 0 ? `
        <button onclick="clearActivityLogs()" class="text-xs text-rose-500 hover:text-rose-700 font-medium">ล้างประวัติกิจกรรม</button>

      </div>
    ` : `
      <div class="space-y-3">
        ${displayedLogs.map((log, idx) => `
          <div class="border rounded-xl p-4 bg-white shadow-sm hover:border-emerald-300 transition flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="badge bg-slate-100 text-slate-700 text-xs font-semibold">#${logs.length - idx}</span>
                <span class="font-bold text-slate-800 text-sm">${esc(log.teacherName || 'ไม่ระบุชื่อครู')}</span>
                <span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 font-medium">วิชา: ${esc(log.subjectName || '-')}</span>
                <span class="text-xs text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 font-medium">ห้อง: ${esc(log.className || '-')}</span>
                <span class="text-xs text-slate-500 font-medium">ภาคเรียนที่ ${esc(log.termString || '-')}</span>
              </div>
              <p class="text-xs text-slate-500">
                ประเมินนักเรียน: <b>${log.studentCount || 0}</b> คน | ค่าเฉลี่ยรวม: <b>${log.averageScore != null ? Number(log.averageScore).toFixed(2) : '-'}</b> | ระดับ: <b>${esc(log.qualityLevel || '-')}</b>
              </p>
            </div>
            <div class="text-right md:min-w-[140px]">
              <span class="text-[11px] text-slate-400 block">${esc(log.timestamp || '-')}</span>
            </div>
          </div>
        `).join('')}
      </div>

      ${hasMore ? `
        <div class="text-center mt-6">
          <button onclick="loadMoreActivity()" class="btn-primary px-6 py-2.5 rounded-xl text-xs font-semibold shadow flex items-center gap-2 mx-auto">
            <span>แสดงเพิ่มอีก 10 รายการ</span>
            <span class="bg-white/20 px-2 py-0.5 rounded text-[11px]">${logs.length - currentLimit} รายการที่เหลือ</span>
          </button>
        </div>
      ` : logs.length > 10 ? `
        <p class="text-center text-xs text-slate-400 mt-6">แสดงครบทั้งหมด ${logs.length} รายการแล้ว</p>
      ` : ''}
    `}
  </div>`;

function loadMoreActivity(){
  state.activityLimit = (state.activityLimit || 10) + 10;
  render();
}

function clearActivityLogs(){
  confirmDel('ยืนยันล้างประวัติกิจกรรม?', 'ข้อมูลประวัติกิจกรรมครูทั้งหมดจะถูกลบ').then(r => {
    if(r.isConfirmed){
      db.activityLogs = [];
      saveDB();
      toast('success', 'ล้างประวัติแล้ว');
      render();
    }
  });
}

function openUserModal(id){
  const u = id ? db.users.find(x => x.id === id) : null;
  Swal.fire({
    title: u ? 'แก้ไขข้อมูลผู้ใช้' : 'เพิ่มผู้ใช้งานใหม่',
    html: `<div class="text-left space-y-3">
      <div><label class="text-xs font-semibold text-slate-600">ชื่อผู้ใช้ (Username)</label><input id="u-u" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${u ? esc(u.username) : ''}"></div>
      <div><label class="text-xs font-semibold text-slate-600">รหัสผ่าน</label><input id="u-p" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${u ? esc(u.password) : ''}"></div>
      <div><label class="text-xs font-semibold text-slate-600">ชื่อ-นามสกุล</label><input id="u-n" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${u ? esc(u.name) : ''}"></div>
      <div><label class="text-xs font-semibold text-slate-600">สิทธิ์การใช้งาน</label>
        <select id="u-r" class="w-full mt-1 px-3 py-2 border rounded-lg" onchange="document.getElementById('u-pos-wrap').style.display=this.value==='teacher'?'block':'none'">
          <option value="admin" ${u?.role==='admin'?'selected':''}>ผู้ดูแลระบบ (Admin)</option>
          <option value="teacher" ${u?.role==='teacher'?'selected':''}>ครูผู้สอน (Teacher)</option>
        </select>
      </div>
      <div id="u-pos-wrap" style="display:${u?.role==='teacher'?'block':'none'}">
        <label class="text-xs font-semibold text-slate-600">ตำแหน่ง / วิทยฐานะ</label>
        <input id="u-pos" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${u ? esc(u.position||'') : ''}">
      </div>
    </div>`,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: () => {
      const username = $('#u-u').value.trim(), password = $('#u-p').value, name = $('#u-n').value.trim();
      const role = $('#u-r').value, position = $('#u-pos-wrap').style.display!=='none' ? $('#u-pos').value.trim() : '';
      if(!username || !password || !name){ Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน'); return false; }
      const dup = db.users.find(x => x.username===username && x.id!==id);
      if(dup){ Swal.showValidationMessage('ชื่อผู้ใช้นี้มีในระบบแล้ว'); return false; }
      return {username, password, name, role, position};
    }
  }).then(r => {
    if(!r.isConfirmed) return;
    if(u) Object.assign(u, r.value);
    else db.users.push({id:uid(), ...r.value});
    saveDB(); toast('success', 'บันทึกสำเร็จ'); render();
  });
}

function delUser(id){
  confirmDel().then(r => {
    if(r.isConfirmed){ db.users = db.users.filter(x => x.id !== id); saveDB(); toast('success', 'ลบผู้ใช้แล้ว'); render(); }
  });
}

  });
}

function openClassModal(){

      <div><label class="text-xs font-semibold">ชื่อชั้นเรียน (เช่น ม.1/1, ม.2/1)</label><input id="cls-n" class="w-full mt-1 px-3 py-2 border rounded-lg" placeholder="ม.1/1"></div>

        <select id="cls-l" class="w-full mt-1 px-3 py-2 border rounded-lg">
          ${db.levels.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}
        </select>
      </div>
    </div>`,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: () => {
      const name = $('#cls-n').value.trim();
      if(!name){ Swal.showValidationMessage('กรอกชื่อชั้นเรียน'); return false; }
      return {name, levelId:$('#cls-l').value};

function delClass(id){ confirmDel().then(r => { if(r.isConfirmed){ db.classes=db.classes.filter(c=>c.id!==id); db.students=db.students.filter(s=>s.classId!==id); saveDB(); render(); }}); }

function viewClassStudents(classId){
  const c = db.classes.find(x => x.id === classId);
  const sts = db.students.filter(s => s.classId === classId).sort((a,b) => a.number - b.number);
  $('#class-students-wrap').innerHTML = `<div class="card p-5 fade-in border-t-4 border-t-emerald-600">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h3 class="font-bold text-slate-800 text-base">รายชื่อนักเรียนห้อง ${esc(c.name)} (${sts.length} คน)</h3>
      <div class="flex gap-2">
        <button onclick="openStudentModal('${classId}')" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">+ เพิ่มนักเรียน</button>
        <button onclick="openExcelImport('${classId}')" class="btn-outline px-3 py-1.5 rounded-lg text-xs font-semibold">📤 นำเข้า Excel</button>
      </div>
    </div>
    <div class="overflow-auto">
      <table class="w-full">
        <thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>จัดการ</th></tr></thead>
        <tbody>
          ${sts.map(s => `<tr>
            <td class="font-semibold">${s.number}</td>
            <td class="text-left font-medium">${esc(s.name)}</td>
            <td class="whitespace-nowrap">
              <button onclick="openStudentModal('${classId}','${s.id}')" class="text-xs px-2.5 py-1 rounded bg-amber-50 text-amber-700 font-semibold mr-1.5">แก้ไข</button>
              <button onclick="delStudent('${s.id}')" class="text-xs px-2.5 py-1 rounded bg-red-50 text-red-700 font-semibold">ลบ</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="3" class="text-center text-slate-400 py-6">ยังไม่มีนักเรียนในห้องนี้</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

function openStudentModal(classId, id){
  const s = id ? db.students.find(x => x.id === id) : null;
  const sts = db.students.filter(x => x.classId === classId);
  const nextNum = s ? s.number : (sts.length ? Math.max(...sts.map(x=>x.number))+1 : 1);
  Swal.fire({
    title: s ? 'แก้ไขข้อมูลนักเรียน' : 'เพิ่มนักเรียนใหม่',
    html: `<div class="text-left space-y-3">
      <div><label class="text-xs font-semibold">เลขที่</label><input id="st-num" type="number" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${nextNum}"></div>
      <div><label class="text-xs font-semibold">ชื่อ-นามสกุล</label><input id="st-name" class="w-full mt-1 px-3 py-2 border rounded-lg" value="${s ? esc(s.name) : ''}"></div>
    </div>`,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: () => {
      const number = +$('#st-num').value, name = $('#st-name').value.trim();
      if(!name){ Swal.showValidationMessage('กรอกชื่อ-นามสกุล'); return false; }
      return {number, name, classId};
    }
  }).then(r => {
    if(!r.isConfirmed) return;
    if(s) Object.assign(s, r.value); else db.students.push({id:uid(), ...r.value});
    saveDB(); toast('success', 'บันทึกสำเร็จ'); render(); setTimeout(() => viewClassStudents(classId), 100);
  });
}
function delStudent(id){ confirmDel().then(r => { if(r.isConfirmed){ db.students = db.students.filter(x => x.id !== id); saveDB(); render(); toast('success','ลบแล้ว'); }}); }

function openExcelImport(classId){
  Swal.fire({
    title: 'นำเข้ารายชื่อจาก Excel',
    html: `<div class="text-left text-xs space-y-2 text-slate-600">
      <p>ไฟล์ Excel (.xlsx) คอลัมน์ที่ 1: เลขที่, คอลัมน์ที่ 2: ชื่อ-นามสกุล</p>
      <input id="xl-file" type="file" accept=".xlsx,.xls" class="w-full px-3 py-2 border rounded-lg bg-slate-50">
    </div>`,
    showCancelButton: true, confirmButtonText: 'เริ่มนำเข้า', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: () => {
      const f = $('#xl-file').files[0];
      if(!f){ Swal.showValidationMessage('กรุณาเลือกไฟล์'); return false; }
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
            const rows = [];
            data.forEach((r, i) => {
              if(i === 0) return; // skip header
              const num = r[0], name = r[1];
              if(name) rows.push({number: +num || i, name: String(name).trim()});
            });
            res(rows);
          } catch(err){ rej(err); }
        };
        reader.readAsArrayBuffer(f);
      });
    }
  }).then(r => {
    if(r.isConfirmed){
      r.value.forEach(row => db.students.push({id:uid(), classId, number:row.number, name:row.name}));
      saveDB(); toast('success', `นำเข้าสำเร็จ ${r.value.length} คน`); render(); setTimeout(() => viewClassStudents(classId), 100);
    }
  });
}

function editTopicType(type){
  state.topicType = type;
  const tree = db.topics[type];
  const el = $('#topic-editor');
  if(!el) return;
  el.innerHTML = `<div class="card p-5">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h3 class="font-bold text-slate-800 text-base">หัวข้อสมรรถนะสำคัญ ${type==='junior'?'ระดับมัธยมศึกษาตอนต้น':'ระดับมัธยมศึกษาตอนปลาย'}</h3>
      <button onclick="addTopicNode(null,'${type}')" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">+ เพิ่มสมรรถนะหลัก</button>
    </div>
    <div class="space-y-2 border-l-2 border-emerald-500 pl-2">
      ${tree.map(n => renderTopicNode(n, type, 0)).join('') || '<p class="text-slate-400 text-xs">ไม่มีหัวข้อ</p>'}
    </div>
  </div>`;
}

function renderTopicNode(n, type, level){
  const indent = level * 16;
  const canAdd = level < 4;
  return `<div class="border-l-2 border-slate-200 pl-2 py-1" style="margin-left:${indent}px">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-xs ${level===0 ? 'font-bold text-emerald-800 text-sm' : 'font-medium text-slate-700'}">${esc(n.name)}</span>
      ${canAdd ? `<button onclick="addTopicNode('${n.id}','${type}')" class="text-xs text-primary font-bold hover:underline">+ ย่อย</button>` : ''}
      <button onclick="editTopicNode('${n.id}','${type}')" class="text-xs text-amber-600 font-bold hover:underline">✎</button>
      <button onclick="delTopicNode('${n.id}','${type}')" class="text-xs text-red-600 font-bold hover:underline">✕</button>
    </div>
    ${n.children?.map(c => renderTopicNode(c, type, level+1)).join('') || ''}
  </div>`;
}

function addTopicNode(parentId, type){
  Swal.fire({
    title: 'เพิ่มหัวข้อสมรรถนะ',
    input: 'textarea', inputAttributes: {rows:3},
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: v => { if(!v.trim()){ Swal.showValidationMessage('กรุณากรอกชื่อหัวข้อ'); return false; } return v.trim(); }
  }).then(r => {
    if(!r.isConfirmed) return;
    const newNode = {id:uid(), name:r.value, children:[]};
    if(parentId == null) db.topics[type].push(newNode);
    else { const p = findNode(db.topics[type], parentId); if(p){ p.children = p.children || []; p.children.push(newNode); } }
    saveDB(); toast('success','เพิ่มหัวข้อแล้ว'); editTopicType(type);
  });
}
function editTopicNode(id, type){
  const n = findNode(db.topics[type], id);
  Swal.fire({
    title: 'แก้ไขหัวข้อ', input: 'textarea', inputValue: n.name, inputAttributes: {rows:3},
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: db.settings.primary,
    preConfirm: v => { if(!v.trim()){ Swal.showValidationMessage('กรอกชื่อหัวข้อ'); return false; } return v.trim(); }
  }).then(r => { if(r.isConfirmed){ n.name = r.value; saveDB(); toast('success','แก้ไขแล้ว'); editTopicType(type); } });
}
function delTopicNode(id, type){
  confirmDel().then(r => {
    if(!r.isConfirmed) return;
    const rm = (nodes) => {
      for(let i=0; i<nodes.length; i++){
        if(nodes[i].id === id){ nodes.splice(i,1); return true; }
        if(nodes[i].children && rm(nodes[i].children)) return true;
      }
      return false;
    };
    rm(db.topics[type]); saveDB(); toast('success','ลบเรียบร้อย'); editTopicType(type);
  });
}

      </select>
    </div>
    <button onclick="runSearch()" class="btn-primary px-5 py-2.5 rounded-xl text-xs font-semibold shadow">🔍 ค้นหา</button>
    <div id="search-results" class="mt-4"></div>
  </div>`;

function runSearch(){
  const termId = $('#s-term').value, levelId = $('#s-level').value, q = $('#s-name').value.toLowerCase(), limit = +$('#s-limit').value;
  $('#search-results').innerHTML = skeletonList(5);
  setTimeout(() => {
    let sts = db.students;
    if(levelId){ const clsIds = db.classes.filter(c => c.levelId === levelId).map(c => c.id); sts = sts.filter(s => clsIds.includes(s.classId)); }
    if(q) sts = sts.filter(s => s.name.toLowerCase().includes(q));
    const rows = [];
    sts.forEach(s => {
      const c = db.classes.find(x => x.id === s.classId);
      const jv = studentOverall(s.id, termId, 'junior');
      const sv = studentOverall(s.id, termId, 'senior');
      rows.push({s, c, jv, sv});
    });
    const shown = limit > 0 ? rows.slice(0, limit) : rows;
    $('#search-results').innerHTML = `<div class="text-xs text-slate-500 mb-2 font-medium">พบทั้งหมด ${rows.length} คน ${limit>0 && rows.length>limit ? '(แสดง ' + limit + ' คนแรก)' : ''}</div>
      <div class="overflow-auto scroll-thin">
      <table class="w-full">
        <thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ชั้นเรียน</th><th>สมรรถนะ ม.ต้น</th><th>สมรรถนะ ม.ปลาย</th></tr></thead>
        <tbody>
          ${shown.map(r => `<tr>
            <td class="font-semibold">${r.s.number}</td>
            <td class="font-medium text-slate-800 text-left">${esc(r.s.name)}</td>
            <td><span class="badge bg-slate-100">${esc(r.c?.name||'-')}</span></td>
            <td>${r.jv!=null ? qBadge(qf(r.jv), r.jv) : '<span class="text-slate-400 text-xs">-</span>'}</td>
            <td>${r.sv!=null ? qBadge(qf(sv), r.sv) : '<span class="text-slate-400 text-xs">-</span>'}</td>
          </tr>`).join('') || '<tr><td colspan="5" class="text-center text-slate-400 py-6">ไม่พบข้อมูล</td></tr>'}
        </tbody>
      </table></div>`;
  }, 100);
}

async function saveAndAutoConnectGas(){
  const url = $('#gas-url').value.trim();
  if(!url){
    Swal.fire('แจ้งเตือน', 'กรุณาระบุ Google Apps Script Web App URL ก่อน', 'warning');
    return;
  }
  db.settings.gasUrl = url;
  saveDB();

  Swal.fire({
    title: 'กำลังเชื่อมต่อ Google Sheets...',
    text: 'กำลังตรวจสอบและจัดเตรียมโครงสร้าง Sheet ให้อัตโนมัติ',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {
    // 1. ตรวจสอบและสร้าง Sheet ที่จำเป็นอัตโนมัติ
    const initRes = await apiCall('init');

async function uploadLogoFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const base64Data = ev.target.result;
    db.settings.logo = base64Data;
    saveDB();
    render();

    // ถ้ามี GAS URL ให้อัปโหลดเข้า Google Drive โฟลเดอร์ DRIVE_FOLDER_ID
    if(db.settings.gasUrl){
      toast('info', 'กำลังส่งรูปภาพไปยัง Google Drive...');
      try {
        const res = await apiCall('uploadFile', {
          base64Data: base64Data,
          fileName: 'logo_' + f.name,
          mimeType: f.type
        });
        if(res && res.fileUrl){
          db.settings.logo = res.fileUrl;
          saveDB();
          toast('success', 'บันทึกลง Google Drive เรียบร้อย');
          render();
        }
      } catch(err){
        console.warn('อัปโหลดเข้า Drive ไม่สำเร็จ บันทึกในระบบเรียบร้อย', err);
      }
    } else {
      toast('success', 'อัปโหลดภาพสำเร็จ');
    }
  };
  reader.readAsDataURL(f);
}

function assessTypeChange(val){
  assessState.type = val;
  assessState.classId = null;
  assessState.topicIdx = 0;
  render();
  setTimeout(renderAssessBody, 80);
}

function assessUpdate(){
  assessState.termId = $('#as-term').value;
  assessState.subjectId = $('#as-subj').value;
  assessState.type = $('#as-type').value;
  assessState.classId = $('#as-class').value;
  assessState.topicIdx = +$('#as-topic').value;
  render();
  setTimeout(renderAssessBody, 80);
}

function renderAssessBody(){
  const body = $('#assess-body');
  if(!body) return;
  const {termId, subjectId, type, classId, topicIdx} = assessState;

  if(!termId || !subjectId || !classId){
    body.innerHTML = `<div class="card p-10 text-center text-slate-400 bg-white">
      <svg class="w-12 h-12 mx-auto mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      <p class="font-bold text-slate-600">กรุณาเลือกข้อมูลให้ครบถ้วน</p>
      <p class="text-xs mt-1">เลือกภาคเรียน รายวิชา และชั้นเรียนด้านบน เพื่อเริ่มทำการประเมิน</p>
    </div>`;
    return;
  }

  const tree = db.topics[type];
  const mainTopic = tree[topicIdx];
  if(!mainTopic){
    body.innerHTML = `<div class="card p-6 text-center text-slate-400">ไม่พบข้อมูลสมรรถนะ</div>`;
    return;
  }

  const path = findPath(tree, mainTopic.id) || [mainTopic];
  const pathStr = path.map(p => p.name).join(' › ');
  const leaves = flattenLeaves([mainTopic]);
  const sts = db.students.filter(s => s.classId === classId).sort((a,b) => a.number - b.number);

  if(sts.length === 0){
    body.innerHTML = `<div class="card p-10 text-center text-slate-400 bg-white">
      <p class="font-bold text-slate-600">ไม่มีรายชื่อนักเรียนในชั้นเรียนนี้</p>
      <p class="text-xs mt-1">กรุณาเพิ่มรายชื่อนักเรียนในเมนู "ชั้นเรียน/นักเรียน" ก่อนทำการประเมิน</p>
    </div>`;
    return;
  }

  // ดึงคะแนนปัจจุบันจากฐานข้อมูลระบบ db.assessments
  const scoresMap = {};
  db.assessments.filter(a => a.teacherId === state.user.id && a.termId === termId && a.subjectId === subjectId && a.classId === classId && a.type === type)
    .forEach(a => {
      scoresMap[a.studentId + '|' + a.topicId] = a.score;
    });

  // ตรวจสอบจำนวนข้อที่ประเมินแล้ว
  let totalRequired = sts.length * leaves.length;
  let totalAnswered = 0;
  sts.forEach(s => {
    leaves.forEach(l => {
      if(scoresMap[s.id + '|' + l.node.id] != null) totalAnswered++;
    });
  });

  const unassessedCount = totalRequired - totalAnswered;

  const splitName = (name) => {
    const m = name.match(/^([\d.]+)\s*(.*)$/);
    if(m) return {code:m[1], text:m[2]||name};
    return {code:'', text:name};
  };

  const headerCells = leaves.map(l => {
    const {code, text} = splitName(l.node.name);
    return `<th class="th-topic" title="${esc(l.node.name)}">
      <div class="code text-emerald-800">${esc(code)}</div>
      <div class="text">${esc(text)}</div>
    </th>`;
  }).join('');

  const rows = sts.map(s => {
    const smap = new Map();
    let stuMissing = 0;
    leaves.forEach(l => {
      const v = scoresMap[s.id + '|' + l.node.id];
      if(v != null) smap.set(l.node.id, v);
      else stuMissing++;
    });
    const sAvg = computeNodeAvg(mainTopic, smap);

    const cells = leaves.map(l => {
      const v = scoresMap[s.id + '|' + l.node.id];
      const isUnset = (v == null || v === '');
      return `<td class="text-center p-1">
        <select class="score-select ${isUnset ? 'score-unassessed' : ''}" data-v="${v ?? ''}" data-sid="${s.id}" data-tid="${l.node.id}" onchange="setStudentScore('${s.id}','${l.node.id}',this.value)">
          <option value="" ${isUnset?'selected':''}>-</option>
          <option value="0" ${v===0?'selected':''}>0</option>
          <option value="1" ${v===1?'selected':''}>1</option>
          <option value="2" ${v===2?'selected':''}>2</option>
          <option value="3" ${v===3?'selected':''}>3</option>
        </select>
      </td>`;
    }).join('');

    return `<tr id="row-stu-${s.id}">
      <td class="text-center"><input type="checkbox" class="stu-check" data-sid="${s.id}"></td>
      <td class="text-center font-bold text-slate-700">${s.number}</td>
      <td class="text-left font-medium whitespace-nowrap pl-2">${esc(s.name)}</td>
      ${cells}
      <td class="text-center font-bold text-slate-800 col-savg">${sAvg != null ? sAvg.toFixed(2) : '-'}</td>
      <td class="text-center col-sbadge">${sAvg != null ? qBadge(qf(sAvg)) : '<span class="text-xs text-rose-500 font-bold">ยังไม่ครบ</span>'}</td>
      <td class="text-center text-xs col-smissing">${stuMissing > 0 ? `<span class="badge q-0 font-bold">${stuMissing}</span>` : '<span class="text-emerald-600 font-bold">✓</span>'}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <!-- หัวข้อที่กำลังประเมิน -->
    <div class="card p-4 mb-3 bg-gradient-to-r from-emerald-50 via-teal-50 to-emerald-50 border border-emerald-200">
      <div class="flex flex-col md:flex-row items-center justify-between gap-3">
        <div>

/**
 * 1. กำหนดคะแนนรายบุคคล: บันทึกลงระบบทันที และอัปเดต UI ทันที
 */
function setStudentScore(studentId, topicId, val){
  const {termId, subjectId, classId, type} = assessState;
  
  const existing = db.assessments.find(a => 
    a.teacherId === state.user.id && 
    a.termId === termId && 
    a.subjectId === subjectId && 
    a.classId === classId && 
    a.type === type && 
    a.studentId === studentId && 
    a.topicId === topicId
  );

  if(val === '' || val == null){
    if(existing){
      db.assessments = db.assessments.filter(a => a !== existing);
    }
  } else {
    const numScore = +val;
    if(existing){
      existing.score = numScore;
    } else {
      db.assessments.push({
        id: uid(),
        teacherId: state.user.id,
        termId,
        subjectId,
        classId,
        type,
        studentId,
        topicId,
        score: numScore
      });
    }
  }

  saveDB(); // บันทึกลง LocalStorage ทันที ข้อมูลขึ้นในระบบทันที!

  // อัปเดต UI แถวนั้นโดยไม่ต้อง render ใหม่ทั้งหมด
  updateRowUI(studentId);
}

/**
 * 2. ตั้งค่าคะแนนให้ทุกคนในห้อง: บันทึกลงระบบทันที
 */
function bulkSetAll(val){
  const {termId, subjectId, classId, type, topicIdx} = assessState;
  const leaves = flattenLeaves([db.topics[type][topicIdx]]);
  const sts = db.students.filter(s => s.classId === classId);

  sts.forEach(s => {
    leaves.forEach(l => {
      const existing = db.assessments.find(a => 
        a.teacherId === state.user.id && 
        a.termId === termId && 
        a.subjectId === subjectId && 
        a.classId === classId && 
        a.type === type && 
        a.studentId === s.id && 
        a.topicId === l.node.id
      );

      if(existing){
        existing.score = +val;
      } else {
        db.assessments.push({
          id: uid(),
          teacherId: state.user.id,
          termId,
          subjectId,
          classId,
          type,
          studentId: s.id,
          topicId: l.node.id,
          score: +val
        });
      }
    });
  });

  saveDB();
  toast('success', `ตั้งค่าคะแนน ${val} ให้ทุกคน (${sts.length} คน) เรียบร้อย`);
  renderAssessBody(); // แสดงผลคะแนนทุกคนในตารางทันที
}

/**

  checkedIds.forEach(sid => {

        a.teacherId === state.user.id && 
        a.termId === termId && 
        a.subjectId === subjectId && 
        a.classId === classId && 
        a.type === type && 
        a.studentId === sid && 
        a.topicId === l.node.id
      );

      if(existing){
        existing.score = +val;
      } else {

          subjectId,
          classId,
          type,
          studentId: sid,
          topicId: l.node.id,

/**
 * อัปเดต UI ของแถวนักเรียนคนนั้นๆ แบบ Real-time
 */
function updateRowUI(studentId){
  const {termId, subjectId, classId, type, topicIdx} = assessState;
  const mainTopic = db.topics[type][topicIdx];
  const leaves = flattenLeaves([mainTopic]);

  const row = document.getElementById('row-stu-' + studentId);
  if(!row) return;

  const smap = new Map();
  let stuMissing = 0;

  leaves.forEach(l => {
    const ex = db.assessments.find(a => 
      a.teacherId === state.user.id && 
      a.termId === termId && 
      a.subjectId === subjectId && 
      a.classId === classId && 
      a.type === type && 
      a.studentId === studentId && 
      a.topicId === l.node.id
    );
    const sel = row.querySelector(`select[data-tid="${l.node.id}"]`);
    if(ex != null && ex.score != null){
      smap.set(l.node.id, ex.score);
      if(sel){
        sel.value = String(ex.score);
        sel.dataset.v = String(ex.score);
        sel.classList.remove('score-unassessed');
      }
    } else {
      stuMissing++;
      if(sel){
        sel.value = '';
        sel.dataset.v = '';
        sel.classList.add('score-unassessed');
      }
    }
  });

  const sAvg = computeNodeAvg(mainTopic, smap);
  const avgCell = row.querySelector('.col-savg');
  const badgeCell = row.querySelector('.col-sbadge');
  const missingCell = row.querySelector('.col-smissing');

  if(avgCell) avgCell.textContent = sAvg != null ? sAvg.toFixed(2) : '-';
  if(badgeCell) badgeCell.innerHTML = sAvg != null ? qBadge(qf(sAvg)) : '<span class="text-xs text-rose-500 font-bold">ยังไม่ครบ</span>';
  if(missingCell) missingCell.innerHTML = stuMissing > 0 ? `<span class="badge q-0 font-bold">${stuMissing}</span>` : '<span class="text-emerald-600 font-bold">✓</span>';
}

/**
 * 4. ปุ่มกดประเมินเพื่อบันทึกข้อมูล:
 *    - ตรวจสอบว่าต้องประเมินครบทุกข้อ ถ้าไม่ครบจะแจ้งเตือนว่าข้อไหน/ใครยังไม่ครบ
 *    - ถ้าครบ บันทึก Activity Log และ Auto-sync ส่งขึ้น Google Sheets ทันที
 */
async function commitAndSaveAssessments(){
  const {termId, subjectId, type, classId, topicIdx} = assessState;
  const tree = db.topics[type];
  const mainTopic = tree[topicIdx];
  const leaves = flattenLeaves([mainTopic]);
  const sts = db.students.filter(s => s.classId === classId).sort((a,b) => a.number - b.number);

  // ดึงคะแนนล่าสุดจาก db.assessments
  const scoresMap = {};
  db.assessments.filter(a => a.teacherId === state.user.id && a.termId === termId && a.subjectId === subjectId && a.classId === classId && a.type === type)
    .forEach(a => {
      scoresMap[a.studentId + '|' + a.topicId] = a.score;
    });

  // ตรวจสอบข้อที่ยังไม่ได้ประเมิน
  const unassessedList = [];
  sts.forEach(s => {
    const missingTopics = [];
    leaves.forEach(l => {
      if(scoresMap[s.id + '|' + l.node.id] == null){
        missingTopics.push(l.node.name);
      }
    });
    if(missingTopics.length > 0){
      unassessedList.push({student: s, missingTopics});
    }
  });

  // ถ้ายังไม่ครบทุกข้อ
  if(unassessedList.length > 0){
    const missingSummaryHtml = unassessedList.map(item => `
      <div class="p-2.5 border-b last:border-0 text-left text-xs bg-white rounded mb-1 border shadow-xs">
        <p class="font-bold text-slate-800">เลขที่ ${item.student.number} ${esc(item.student.name)} <span class="text-rose-600 font-bold">(ค้าง ${item.missingTopics.length} ข้อ)</span></p>
        <ul class="list-disc list-inside text-slate-600 mt-1 pl-1 space-y-0.5">
          ${item.missingTopics.map(t => `<li class="truncate" title="${esc(t)}">${esc(t)}</li>`).join('')}
        </ul>
      </div>
    `).join('');

    Swal.fire({
      title: 'ยังประเมินไม่ครบทุกข้อ!',
      html: `
        <div class="text-left mb-2">
          <p class="text-xs text-rose-600 font-bold mb-2">กรุณาประเมินสมรรถนะให้ครบถ้วนทุกข้อก่อนบันทึกข้อมูล (มีนักเรียนที่ยังไม่ครบ ${unassessedList.length} คน):</p>
          <div class="max-h-56 overflow-y-auto border rounded-xl bg-rose-50/60 p-2 scroll-thin">
            ${missingSummaryHtml}
          </div>
        </div>
      `,
      icon: 'warning',
      confirmButtonText: 'กลับไปประเมินให้ครบ',
      confirmButtonColor: '#ef4444'
    }).then(() => {
      const firstMissingId = unassessedList[0].student.id;
      const row = document.getElementById('row-stu-' + firstMissingId);
      if(row){
        row.scrollIntoView({behavior:'smooth', block:'center'});
        row.classList.add('bg-rose-100');
        setTimeout(() => row.classList.remove('bg-rose-100'), 2500);
      }
    });
    return;
  }

  // ประเมินครบถ้วน 100% แล้ว
  const curTermObj = db.terms.find(t => t.id === termId);
  const termStr = curTermObj ? `${curTermObj.semester}/${curTermObj.year}` : '-';
  const clsObj = db.classes.find(c => c.id === classId);
  const subjObj = db.subjects.find(s => s.id === subjectId);

  const studentDetails = sts.map(s => {
    const smap = new Map();
    leaves.forEach(l => smap.set(l.node.id, scoresMap[s.id + '|' + l.node.id]));
    const sAvg = computeNodeAvg(mainTopic, smap);
    return {
      number: s.number,
      name: s.name,
      average: sAvg != null ? sAvg.toFixed(2) : '0.00',
      qualityText: sAvg != null ? QN[qf(sAvg)] : '-'
    };
  });

  const totalClassAvg = avg(studentDetails.map(d => +d.average));

  // สร้าง Activity Log ในระบบ
  const newActivityLog = {
    id: uid(),
    timestamp: new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }),
    teacherName: state.user.name,
    subjectName: subjObj?.name || '',
    className: clsObj?.name || '',
    termString: termStr,
    studentCount: sts.length,
    averageScore: totalClassAvg != null ? totalClassAvg.toFixed(2) : '0.00',
    qualityLevel: totalClassAvg != null ? QN[qf(totalClassAvg)] : '-'
  };

  db.activityLogs.push(newActivityLog);
  saveDB(); // บันทึกข้อมูลขึ้นระบบทันที

  // Auto-Sync ส่งขึ้น Google Sheets ในพื้นหลังทันที (ถ้ามี URL)
  if(db.settings.gasUrl){
    // แสดง toast หรือ SweetAlert2 บันทึกสำเร็จ
    Swal.fire({
      title: 'บันทึกสำเร็จ!',
      html: `
        <div class="text-xs text-slate-600 text-left space-y-1">
          <p>• ข้อมูลถูกบันทึกในระบบเรียบร้อยแล้ว</p>
          <p>• ระบบกำลังส่งข้อมูลไปยัง Google Sheets และแยกชีท <b>ห้อง_${esc(clsObj?.name||'')}</b> ให้อัตโนมัติ</p>
        </div>
      `,
      icon: 'success',
      timer: 2000,
      showConfirmButton: false
    });

    try {
      const allTeacherRecords = db.assessments.filter(a => 
        a.teacherId === state.user.id && 
        a.termId === termId && 
        a.subjectId === subjectId && 
        a.classId === classId && 
        a.type === type
      );

      // ส่ง API ในเบื้องหลังทันที
      apiCall('saveAssessments', {
        records: allTeacherRecords,
        studentDetails: studentDetails,
        logInfo: newActivityLog
      }).then(res => {
        if(res && res.status === 'success'){
          toast('success', 'ซิงค์ข้อมูลลง Google Sheets เรียบร้อย');
        }
      }).catch(err => {
        console.warn('Google Sheets background sync error:', err);
      });
    } catch(err) {
      console.warn('Sync error:', err);
    }
  } else {
    Swal.fire({
      title: 'บันทึกสำเร็จ!',
      text: 'ข้อมูลถูกบันทึกในระบบเรียบร้อย ข้อมูลอัปเดตไปยังแดชบอร์ดและรายงานผลแล้ว',
      icon: 'success',
      confirmButtonColor: db.settings.primary
    });
  }

  renderAssessBody();
}

        <button onclick="fetchCloudData(false)" title="ดึงข้อมูลล่าสุดจาก Google Sheets" class="bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-xs">
          <svg class="w-3.5 h-3.5 ${isSyncingCloud ? 'spin' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="hidden sm:inline">ดึงข้อมูลสด</span>
        </button>

        ${state.user ? `
          <span class="text-xs bg-white/10 px-3 py-1.5 rounded-lg border border-white/20 font-medium hidden sm:inline">
            👤 ${esc(state.user.name)} (${state.user.role === 'admin' ? 'ผู้ดูแล' : 'ครู'})
          </span>
          <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition">ออกจากระบบ</button>
        ` : `
          <button onclick="navigate('home')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition">หน้าแรก</button>
          <button onclick="openLoginModal()" class="bg-white text-emerald-800 hover:bg-emerald-50 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">เข้าสู่ระบบ</button>
        `}
      </div>
    </div>
  </header>`;
}

function logout(){
  Swal.fire({
    title: 'ออกจากระบบ?',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'ออกจากระบบ',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#ef4444'
  }).then(r => {
    if(r.isConfirmed){
      state.user = null;
      state.view = 'home';
      toast('success', 'ออกจากระบบเรียบร้อย');
      render();
    }
  });
}

// =================== BOOTSTRAP ===================
async function boot(){
  loadDB();
  applyTheme();
  render();

  // ดึงข้อมูลสดจาก Google Sheets อัตโนมัติทันทีที่เปิดแอป (เพื่อแสดงผลให้ตรงกันทุกเบราว์เซอร์/ทุกเครื่อง)
  if(db.settings.gasUrl){
    fetchCloudData(true);
  }
}
boot();
</script>
</body>
</html>
