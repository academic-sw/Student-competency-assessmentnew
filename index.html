// Image Resizer Helper to ensure upload has optimal size
function resizeImage(file, maxWidth=800, maxHeight=800, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxWidth){ h=Math.round((h*maxWidth)/w); w=maxWidth; } }
        else{ if(h>maxHeight){ w=Math.round((w*maxHeight)/h); h=maxHeight; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// =================== GAS SYNC API (CORS & JSONP Supported) ===================
async function callGas(action, payload){
  const apiUrl = db.settings.gasApiUrl || DEFAULT_GAS_URL;
  if(!apiUrl){
    console.warn("GAS URL not configured");
    return { status: 'offline', message: 'GAS URL not configured' };
  }

  // 1. ถ้าเป็นการ getDatabase สามารถใช้ JSONP ข้าม Domain ได้อย่างลื่นไหล 100% ไม่มีปัญหาเรื่อง CORS
  if(action === 'getDatabase'){
    return new Promise((resolve)=>{
      const cbName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
      let resolved = false;
      
      const timeout = setTimeout(()=>{
        if(!resolved){
          resolved = true;
          delete window[cbName];
          resolve({ status: 'timeout', message: 'Connection timed out' });
        }
      }, 10000);

      window[cbName] = function(res){
        if(!resolved){
          resolved = true;
          clearTimeout(timeout);
          delete window[cbName];
          if(document.getElementById(cbName)) document.getElementById(cbName).remove();
          resolve(res);
        }
      };

      const script = document.createElement('script');
      script.id = cbName;
      const delim = apiUrl.indexOf('?') > -1 ? '&' : '?';
      script.src = `${apiUrl}${delim}action=getDatabase&callback=${cbName}&_t=${Date.now()}`;
      script.onerror = function(){
        if(!resolved){
          resolved = true;
          clearTimeout(timeout);
          delete window[cbName];
          if(document.getElementById(cbName)) document.getElementById(cbName).remove();
          // Fallback ลอง fetch
          fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          }).then(r=>r.json()).then(resolve).catch(err=>resolve({ status:'error', message: err.toString() }));
        }
      };
      document.body.appendChild(script);
    });
  }

  // 2. สำหรับ POST Actions (saveAssessments, syncFullDatabase, ฯลฯ)
  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload })
    });
    return await res.json();
  } catch(err) {
    console.error("GAS API Error:", err);
    return { status: 'error', message: err.toString() };
  }
}

// ฟังก์ชันดึงข้อมูลจาก Google Sheets อัตโนมัติ (Silent Sync เบื้องหลัง)
async function syncFromGoogleSheets(silent = true){
  const apiUrl = db.settings.gasApiUrl || DEFAULT_GAS_URL;
  if(!apiUrl || isSyncing) return;
  isSyncing = true;
  updateSyncIndicator('syncing');

  if(!silent){
    Swal.fire({title:'กำลังโหลดข้อมูลจาก Google Sheets...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
  }

  try {
    const res = await callGas('getDatabase', {});
    if(!silent) Swal.close();

    if(res && res.status === 'success' && res.data){
      const d = res.data;
      if(d.users && d.users.length) db.users = d.users;
      if(d.terms && d.terms.length) db.terms = d.terms;
      if(d.subjectGroups && d.subjectGroups.length) db.subjectGroups = d.subjectGroups;
      if(d.subjects && d.subjects.length) db.subjects = d.subjects;
      if(d.levels && d.levels.length) db.levels = d.levels;
      if(d.classes && d.classes.length) db.classes = d.classes;
      if(d.students && d.students.length) db.students = d.students;
      if(d.assessments) db.assessments = d.assessments;
      if(d.activities) db.activities = d.activities;
      if(d.settings) {
        // รักษา gasApiUrl เดิมไว้
        const currentUrl = db.settings.gasApiUrl;
        Object.assign(db.settings, d.settings);
        if(currentUrl) db.settings.gasApiUrl = currentUrl;
      }
      saveDB();
      updateSyncIndicator('online');
      if(!silent) toast('success', 'ซิงก์ข้อมูลจาก Google Sheets สำเร็จ');
      
      // อัปเดตการแสดงผลหน้าปัจจุบัน
      if(state.view === 'public-dash') renderPublicDashData();
      else if(state.view === 'teacher' && state.teacherTab === 'assess') renderAssessBody();
      else if(state.view === 'teacher' && state.teacherTab === 'dashboard') renderTeacherDash();
      else if(state.view === 'admin' && state.adminTab === 'activity') render();
      else if(state.view === 'admin' && state.adminTab === 'dashboard') renderAdminDashData();
    } else {
      updateSyncIndicator('offline');
      if(!silent) toast('error', 'ไม่สามารถเชื่อมต่อ Google Sheets: ' + (res?.message||''));
    }
  } catch(e) {
    updateSyncIndicator('offline');
    if(!silent) toast('error', 'เกิดข้อผิดพลาด: ' + e.toString());
  } finally {
    isSyncing = false;
  }
}

function updateSyncIndicator(status){
  const el = $('#sync-status-indicator');
  if(!el) return;
  if(status === 'syncing'){
    el.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800 animate-pulse"><span class="w-2 h-2 rounded-full bg-amber-500"></span> กำลังดึงข้อมูลล่าสุด...</span>`;
  } else if(status === 'online'){

// =================== TREE HELPERS ===================
function flattenLeaves(nodes, path=[]){
  let out=[];
  for(const n of nodes){
    const p=[...path,n];
    if(!n.children||n.children.length===0) out.push({node:n, path:p});
    else out=out.concat(flattenLeaves(n.children,p));
  }
  return out;
}
function findNode(nodes,id){
  for(const n of nodes){
    if(n.id===id)return n;
    if(n.children){const f=findNode(n.children,id);if(f)return f}
  }
  return null;
}
function findPath(nodes,id,path=[]){
  for(const n of nodes){
    if(n.id===id)return [...path,n];
    if(n.children){const f=findPath(n.children,id,[...path,n]);if(f)return f}
  }
  return null;
}
function computeNodeAvg(node, scores){
  if(!node.children||node.children.length===0){
    return scores.has(node.id)?scores.get(node.id):null;
  }
  const c=node.children.map(ch=>computeNodeAvg(ch,scores)).filter(v=>v!=null);
  return c.length?avg(c):null;
}
function studentScores(studentId, termId, type){
  const scores=new Map();
  const tmp={};
  db.assessments.filter(a=>a.studentId===studentId && a.termId===termId && a.type===type)
    .forEach(a=>{ (tmp[a.topicId]=tmp[a.topicId]||[]).push(a.score) });
  Object.entries(tmp).forEach(([k,v])=>scores.set(k,avg(v)));
  return scores;
}
function studentOverall(studentId, termId, type){
  const scores=studentScores(studentId,termId,type);
  const tree=db.topics[type]||[];
  const roots=tree.map(t=>computeNodeAvg(t,scores)).filter(v=>v!=null);
  return roots.length?avg(roots):null;
}

  return `<div class="card p-5 fade-in text-center">

    <p class="mt-2 text-xs text-slate-400">จาก ${d.count} คน</p>
  </div>`;
}

function computeDashboard(termId){
  const calcLevel=(lt)=>{
    const lvIds=db.levels.filter(l=>l.type===lt).map(l=>l.id);
    const clsIds=db.classes.filter(c=>lvIds.includes(c.levelId)).map(c=>c.id);
    const sts=db.students.filter(s=>clsIds.includes(s.classId));
    const vals=[];
    sts.forEach(s=>{
      const v=studentOverall(s.id,termId,lt);
      if(v!=null) vals.push(v);
    });
    const a=avg(vals);
    return {avg:a, level:qf(a), count:vals.length};
  };

  const allVals=[];
  const seen=new Set();
  db.students.forEach(s=>{
    const vj=studentOverall(s.id,termId,'junior');
    const vs=studentOverall(s.id,termId,'senior');
    if(vj!=null) allVals.push(vj);
    if(vs!=null) allVals.push(vs);
    if(vj!=null||vs!=null) seen.add(s.id);
  });
  const schoolAvg=avg(allVals);
  const school={avg:schoolAvg, level:qf(schoolAvg), count:seen.size};

  const byLevel=db.levels.map(l=>{
    const clsIds=db.classes.filter(c=>c.levelId===l.id).map(c=>c.id);
    const sts=db.students.filter(s=>clsIds.includes(s.classId));
    const vals=[];
    sts.forEach(s=>{
      const v=studentOverall(s.id,termId,l.type);
      if(v!=null) vals.push(v);
    });
    return {name:l.name, avg:avg(vals), level:qf(avg(vals)), count:vals.length};
  });

  return {school, junior:calcLevel('junior'), senior:calcLevel('senior'), byLevel};
}

function renderClassChart(){

  if(!container) return;

    container.innerHTML=`<div class="p-12 text-center text-slate-400 border border-dashed rounded-xl bg-slate-50"><p class="text-sm font-medium">กรุณาเลือกชั้นเรียนด้านบนเพื่อแสดงกราฟสรุปรายชั้น</p></div>`;
    return;
  }
  container.innerHTML=`<div class="relative h-80"><canvas id="class-chart"></canvas></div>`;
  const el=$('#class-chart');
  const termId=$('#pub-term')?.value || db.terms.find(t=>t.current)?.id;
  const cls=db.classes.find(c=>c.id===state.pubClassFilter);
  if(!cls) return;

  const level=db.levels.find(l=>l.id===cls.levelId);
  const type=level?.type || 'junior';
  const mainTopics=db.topics[type]||[];
  const sts=db.students.filter(s=>s.classId===cls.id);

  // คำนวณค่าเฉลี่ย 5 ด้านของห้องนี้
  const labels=mainTopics.map(t=>t.name);
  const averages=mainTopics.map(topic=>{
    const leaves=flattenLeaves([topic]);
    const studentTopicAvgs=[];
    sts.forEach(s=>{
      const smap=new Map();
      leaves.forEach(l=>{
        const ass=db.assessments.filter(a=>a.studentId===s.id && a.termId===termId && a.topicId===l.node.id);
        if(ass.length>0){ smap.set(l.node.id, avg(ass.map(x=>x.score))); }
      });
      const a=computeNodeAvg(topic, smap);
      if(a!=null) studentTopicAvgs.push(a);
    });
    return avg(studentTopicAvgs);
  });

  if(classChartInstance) classChartInstance.destroy();
  classChartInstance=new Chart(el, {
    type:'bar',
    data:{
      labels:labels.map(l=>l.length>22?l.substring(0,22)+'...':l),
      datasets:[{
        label:`ค่าเฉลี่ยห้อง ${cls.name}`,
        data:averages,
        backgroundColor:db.settings.secondary,
        borderRadius:8
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        tooltip:{
          callbacks:{
            title:(ctx)=>labels[ctx[0].dataIndex]
          }
        }
      },
      scales:{
        y:{beginAtZero:true, max:3, ticks:{stepSize:0.5}}
      }
    }
  });
}

function openExcelImport(classId){
  Swal.fire({
    title:'อัปโหลดรายชื่อจาก Excel',
    html:`<div class="text-left text-sm space-y-2">
      <p class="text-slate-600">ไฟล์ Excel ต้องมีคอลัมน์ <b>เลขที่</b> และ <b>ชื่อ-นามสกุล</b></p>
      <input id="xl-file" type="file" accept=".xlsx,.xls" class="w-full px-3 py-2 border rounded-lg">
    </div>`,
    showCancelButton:true,confirmButtonText:'นำเข้า',cancelButtonText:'ยกเลิก',confirmButtonColor:db.settings.primary,
    preConfirm:()=>{
      const f=$('#xl-file').files[0];
      if(!f){Swal.showValidationMessage('เลือกไฟล์');return false}
      return new Promise((res,rej)=>{
        const reader=new FileReader();
        reader.onload=e=>{
          try{
            const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
            const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
            const rows=[];
            data.forEach((r,i)=>{
              if(i===0) return;
              const num=r[0], name=r[1];
              if(name) rows.push({number:+num||i, name:String(name).trim()});
            });
            res(rows);
          }catch(err){rej(err)}
        };
        reader.readAsArrayBuffer(f);
      });
    }
  }).then(r=>{
    if(r.isConfirmed){
      r.value.forEach(row=>db.students.push({id:uid(),classId,number:row.number,name:row.name}));
      saveDB(); syncFullToGas(); toast('success',`เพิ่ม ${r.value.length} คน`); render(); setTimeout(()=>viewClassStudents(classId),100);
    }
  });
}

      <button onclick="addTopicNode(null,'${type}')" class="btn-primary px-3 py-2 rounded-lg text-sm font-medium">+ เพิ่มหัวข้อใหญ่</button>
    </div>
    <div class="space-y-2">${tree.map(n=>renderTopicNode(n,type,0)).join('')||'<p class="text-slate-400 text-sm">ไม่มีหัวข้อ</p>'}</div>
  </div>`;
}

function renderTopicNode(n,type,level){
  const indent=level*16;
  const canAdd=level<4;
  return `<div class="border-l-2 border-slate-200 pl-2" style="margin-left:${indent}px">
    <div class="flex items-center gap-2 py-1 flex-wrap">
      <span class="text-sm ${level===0?'font-bold':'font-medium'}">${esc(n.name)}</span>
      ${canAdd?`<button onclick="addTopicNode('${n.id}','${type}')" class="text-xs text-primary font-bold">+ ย่อย</button>`:''}
      <button onclick="editTopicNode('${n.id}','${type}')" class="text-xs text-amber-600">✎</button>
      <button onclick="delTopicNode('${n.id}','${type}')" class="text-xs text-red-600">✕</button>
    </div>
    ${n.children?.map(c=>renderTopicNode(c,type,level+1)).join('')||''}
  </div>`;
}

function addTopicNode(parentId,type){
  Swal.fire({
    title:'เพิ่มหัวข้อ',
    input:'textarea', inputAttributes:{rows:3},
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',confirmButtonColor:db.settings.primary,
    preConfirm:v=>{ if(!v.trim()){Swal.showValidationMessage('กรอกชื่อ');return false} return v.trim(); }
  }).then(r=>{
    if(!r.isConfirmed)return;
    const newNode={id:uid(),name:r.value,children:[]};
    if(parentId==null) db.topics[type].push(newNode);
    else{ const p=findNode(db.topics[type],parentId); if(p){ p.children=p.children||[]; p.children.push(newNode); } }
    saveDB(); toast('success','เพิ่มแล้ว'); editTopicType(type);
  });
}
function editTopicNode(id,type){
  const n=findNode(db.topics[type],id);
  Swal.fire({
    title:'แก้ไขหัวข้อ', input:'textarea', inputValue:n.name, inputAttributes:{rows:3},
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',confirmButtonColor:db.settings.primary,
    preConfirm:v=>{ if(!v.trim()){Swal.showValidationMessage('กรอกชื่อ');return false} return v.trim(); }
  }).then(r=>{ if(r.isConfirmed){ n.name=r.value; saveDB(); toast('success','บันทึกแล้ว'); editTopicType(type); }});
}
function delTopicNode(id,type){
  confirmDel().then(r=>{
    if(!r.isConfirmed)return;
    const rm=(nodes)=>{ for(let i=0;i<nodes.length;i++){ if(nodes[i].id===id){nodes.splice(i,1);return true} if(nodes[i].children&&rm(nodes[i].children))return true; } return false; };
    rm(db.topics[type]); saveDB(); toast('success','ลบแล้ว'); editTopicType(type);
  });
}

async function syncFullToGas(showToast=false){
  if(!db.settings.gasApiUrl) return;
  if(showToast) Swal.fire({title:'กำลังส่งข้อมูลขึ้น Google Sheets...', didOpen:()=>Swal.showLoading()});
  const res = await callGas('syncFullDatabase', db);
  if(showToast) {
    Swal.close();
    if(res && res.status==='success') toast('success','ส่งข้อมูลขึ้น Google Sheets สำเร็จ');
    else toast('error','เกิดข้อผิดพลาดในการส่งข้อมูล: '+(res?.message||''));
  }
}

async function uploadLogoOptimized(e){
  const file=e.target.files[0]; if(!file)return;
  Swal.fire({title:'กำลังปรับขนาดรูปภาพและอัปโหลดลง Google Drive...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
  try{
    // ปรับสัดส่วนรูปภาพให้พอดี ไม่เกิน 600x600 และคุณภาพ 0.85
    const resizedBase64 = await resizeImage(file, 600, 600, 0.85);
    
    // หากมี GAS URL ให้อัปโหลดลง Drive
    if(db.settings.gasApiUrl){
      const res = await callGas('uploadFile', {
        base64Data: resizedBase64,
        fileName: 'logo_' + Date.now() + '.jpg',
        mimeType: 'image/jpeg',
        isLogo: true
      });
      Swal.close();
      if(res && res.status==='success' && res.url){
        db.settings.logo = res.url;
        saveDB();
        toast('success','อัปโหลดรูปภาพลง Google Drive สำเร็จ');
        render();
        return;
      }
    }
    
    // ถ้ายังไม่ได้ตั้ง GAS หรือเกิดปัญหา ใช้ Local Base64 ทันที
    Swal.close();
    db.settings.logo = resizedBase64;
    saveDB();
    toast('success','บันทึกรูปภาพเรียบร้อย (ปรับขนาดพอดีแล้ว)');
    render();
  }catch(err){
    Swal.close();
    toast('error','เกิดข้อผิดพลาด: '+err.toString());
  }
}

              const ss=db.subjects.filter(s=>s.groupId===g.id);
              if(!ss.length)return '';
              return `<optgroup label="${esc(g.name)}">${ss.map(s=>`<option value="${s.id}" ${s.id===assessState.subjectId?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
            }).join('')}
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-500 font-medium">ประเภท</label>
          <select id="as-type" class="w-full mt-1 px-2 py-2 border rounded-lg text-sm" onchange="assessUpdate()">
            <option value="junior" ${assessState.type==='junior'?'selected':''}>ม.ต้น</option>
            <option value="senior" ${assessState.type==='senior'?'selected':''}>ม.ปลาย</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-500 font-medium">ชั้นเรียน</label>
          <select id="as-class" class="w-full mt-1 px-2 py-2 border rounded-lg text-sm" onchange="assessUpdate()">
            <option value="">- เลือกชั้นเรียน -</option>
            ${db.classes.filter(c=>{const lv=db.levels.find(l=>l.id===c.levelId);return lv?.type===assessState.type}).map(c=>`<option value="${c.id}" ${c.id===assessState.classId?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-500 font-medium">ด้านที่ประเมิน</label>
          <select id="as-topic" class="w-full mt-1 px-2 py-2 border rounded-lg text-sm" onchange="assessUpdate()">
            ${tree.map((t,i)=>`<option value="${i}" ${i===assessState.topicIdx?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div id="assess-body">${skeletonList(8)}</div>
  </div>`;
}

function assessUpdate(){
  assessState.termId=$('#as-term').value;
  assessState.subjectId=$('#as-subj').value;
  assessState.type=$('#as-type').value;
  assessState.classId=$('#as-class').value;
  assessState.topicIdx=+$('#as-topic').value;
  assessDraft = {}; // Reset draft on selector change
  render();
  setTimeout(renderAssessBody,150);
}

function renderAssessBody(){
  const body=$('#assess-body'); if(!body) return;
  const {termId,subjectId,type,classId,topicIdx}=assessState;
  if(!termId||!subjectId||!classId){ body.innerHTML=`<div class="card p-8 text-center text-slate-400">กรุณาเลือกภาคเรียน รายวิชา และชั้นเรียน เพื่อเริ่มการประเมิน</div>`; return; }

  const tree=db.topics[type];
  const mainTopic=tree[topicIdx];
  if(!mainTopic){ body.innerHTML=`<div class="card p-8 text-center text-slate-400">ไม่พบหัวข้อประเมิน</div>`; return; }

  const path=findPath(tree,mainTopic.id)||[mainTopic];
  const pathStr=path.map(p=>p.name).join(' › ');

  const leaves=flattenLeaves([mainTopic]);
  const sts=db.students.filter(s=>s.classId===classId).sort((a,b)=>a.number-b.number);

  if(sts.length===0){ body.innerHTML=`<div class="card p-8 text-center text-slate-400">ยังไม่มีรายชื่อนักเรียนในชั้นเรียนนี้ (ไปที่ระบบผู้ดูแลเพื่อเพิ่มนักเรียน)</div>`; return; }

  // Load existing scores from DB into draft if not yet modified in draft
  db.assessments.filter(a=>a.teacherId===state.user.id && a.termId===termId && a.subjectId===subjectId && a.classId===classId && a.type===type)
    .forEach(a=>{
      const key=a.studentId+'|'+a.topicId;
      if(assessDraft[key]===undefined) assessDraft[key]=a.score;
    });

  // helper to split topic code and readable full description
  const splitName=(name)=>{
    const m=name.match(/^([\d.]+)\s*(.*)$/);
    if(m) return {code:m[1], text:m[2]||name};
    return {code:'', text:name};
  };

  // ตรวจสอบว่ามีข้อไหนหรือนักเรียนคนไหนยังไม่ได้ประเมิน
  let totalRequiredScores = sts.length * leaves.length;
  let filledScoresCount = 0;
  let unassessedList = []; // รายการที่ค้าง

  sts.forEach(s=>{
    leaves.forEach(l=>{
      const key = s.id+'|'+l.node.id;
      const v = assessDraft[key];
      if(v!==undefined && v!==null && v!=='') {
        filledScoresCount++;
      } else {
        const {code} = splitName(l.node.name);
        unassessedList.push({
          studentNumber: s.number,
          studentName: s.name,
          topicCode: code || l.node.name
        });
      }
    });
  });

  const isAllAssessed = (filledScoresCount === totalRequiredScores);
  const remainingCount = totalRequiredScores - filledScoresCount;

  // Header cells with clear readable subtopics
  const headerCells=leaves.map((l,i)=>{
    const {code,text}=splitName(l.node.name);
    return `<th class="th-topic" title="${esc(l.node.name)}">
      <div class="code">ข้อ ${esc(code)}</div>
      <div class="text">${esc(text)}</div>
    </th>`;
  }).join('');

  // Bulk actions bar
  const bulkBar=`<div class="card p-3 mb-3 flex flex-wrap gap-2 items-center justify-between">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-xs font-semibold text-slate-600">ตั้งค่าทุกคน:</span>
      ${[3,2,1,0].map(v=>`<button onclick="bulkSetAll(${v})" class="px-2.5 py-1 rounded text-xs font-semibold score-select" data-v="${v}">${v} : ${QN[v]}</button>`).join('')}
      <span class="text-xs font-semibold text-slate-600 ml-3">เฉพาะคนที่ติ๊กเลือก:</span>
      ${[3,2,1,0].map(v=>`<button onclick="bulkSetSelected(${v})" class="px-2.5 py-1 rounded text-xs font-semibold score-select" data-v="${v}">${v}</button>`).join('')}
    </div>
    <div class="text-xs">
      ${isAllAssessed ? 
        `<span class="badge q-3 font-semibold px-3 py-1">✓ ประเมินครบทุกข้อแล้ว (${filledScoresCount}/${totalRequiredScores})</span>` : 
        `<span class="badge q-0 font-semibold px-3 py-1">⚠️ ยังค้างประเมินอีก ${remainingCount} จุด</span>`}
    </div>
  </div>`;

  // Info banner
  const contextCard=`<div class="card p-3 mb-3 bg-emerald-50 border border-emerald-200">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="text-left">
        <p class="text-xs text-emerald-700 font-semibold">กำลังประเมินหัวข้อ: <span class="text-emerald-900">${esc(pathStr)}</span></p>
        <p class="text-xs text-slate-500 mt-0.5">มีหัวข้อย่อยทั้งหมด <b>${leaves.length}</b> ข้อ · นักเรียน <b>${sts.length}</b> คน (เกณฑ์: 3=ดีเยี่ยม, 2=ดี, 1=พอใช้, 0=ปรับปรุง)</p>
      </div>
      <div class="text-right">
        <button onclick="checkUnassessedModal()" class="px-3 py-1.5 rounded-lg border border-rose-300 text-rose-700 bg-white hover:bg-rose-50 text-xs font-semibold">
          🔍 ตรวจดูข้อที่ยังไม่ได้ประเมิน (${remainingCount})
        </button>
      </div>
    </div>
  </div>`;

  // Rows
  const rows=sts.map(s=>{
    const studentScoresList=[];
    let studentMissing=0;
    const cells=leaves.map(l=>{
      const key=s.id+'|'+l.node.id;
      const v=assessDraft[key];
      const isMissing = (v===undefined || v===null || v==='');
      if(!isMissing) studentScoresList.push(Number(v));
      else studentMissing++;

      return `<td>
        <select class="score-select ${isMissing ? 'cell-unassessed' : ''}" data-v="${v??''}" onchange="updateDraftScore('${s.id}','${l.node.id}',this.value)">
          <option value="" ${isMissing?'selected':''}>-</option>
          <option value="0" ${v===0||v==='0'?'selected':''}>0</option>
          <option value="1" ${v===1||v==='1'?'selected':''}>1</option>
          <option value="2" ${v===2||v==='2'?'selected':''}>2</option>
          <option value="3" ${v===3||v==='3'?'selected':''}>3</option>
        </select>
      </td>`;
    }).join('');

    const sAvg = studentScoresList.length ? avg(studentScoresList) : null;
    return `<tr>
      <td><input type="checkbox" class="stu-check" data-sid="${s.id}"></td>
      <td class="font-bold text-slate-700">${s.number}</td>
      <td class="font-medium whitespace-nowrap text-left px-3">${esc(s.name)}</td>
      ${cells}
      <td class="font-semibold">${sAvg!=null?sAvg.toFixed(2):'-'}</td>
      <td>${studentMissing===0 ? qBadge(qf(sAvg),sAvg) : `<span class="badge q-0 text-xs">ค้าง ${studentMissing} ข้อ</span>`}</td>
    </tr>`;
  }).join('');

  // Submit assessment button bar (ตามที่ขอ: มีบอกว่าข้อไหนที่ยังไม่ได้ประเมิน ต้องประเมินทุกข้อ และมีปุ่มกดส่งข้อมูลแบบประเมิน)
  const submitBar=`<div class="card p-4 mt-4 flex flex-col sm:flex-row items-center justify-between gap-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl shadow-lg">
    <div>
      <h4 class="font-bold text-base">บันทึกข้อมูลการประเมินลง Google Sheet</h4>
      <p class="text-xs text-emerald-100">ระบบจะทำการตรวจสอบว่าประเมินครบทุกข้อก่อนส่ง และแยกบันทึกลงชีทรายห้องให้อัตโนมัติ</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="checkUnassessedModal()" class="px-4 py-2.5 rounded-xl bg-white/20 hover:bg-white/30 text-white text-xs font-semibold backdrop-blur-sm transition">
        ตรวจสอบความครบถ้วน
      </button>
      <button onclick="submitAssessmentData()" class="px-6 py-2.5 rounded-xl bg-white text-emerald-800 hover:bg-emerald-50 text-sm font-bold shadow-md transition flex items-center gap-1.5">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        กดส่งข้อมูลแบบประเมิน
      </button>
    </div>
  </div>`;

  body.innerHTML=`${contextCard}${bulkBar}
    <div class="card p-4 overflow-auto scroll-thin" style="max-height:75vh">
      <table class="w-full">
        <thead><tr>
          <th style="min-width:36px"><input type="checkbox" id="checkAllStu"></th>
          <th style="min-width:48px">เลขที่</th>
          <th style="min-width:180px">ชื่อ-นามสกุล</th>
          ${headerCells}
          <th style="min-width:70px">เฉลี่ย</th>
          <th style="min-width:140px">ระดับคุณภาพ</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${submitBar}
  `;

  $('#checkAllStu').onchange=e=>{ $$('.stu-check').forEach(c=>c.checked=e.target.checked); };
}

function updateDraftScore(studentId, topicId, val){
  const key = studentId + '|' + topicId;
  if(val === '') delete assessDraft[key];
  else assessDraft[key] = Number(val);
  renderAssessBody();
}

function bulkSetAll(val){
  const {classId, type, topicIdx} = assessState;
  const leaves = flattenLeaves([db.topics[type][topicIdx]]);
  const sts = db.students.filter(s=>s.classId===classId);
  sts.forEach(s=>leaves.forEach(l=>{
    assessDraft[s.id + '|' + l.node.id] = val;
  }));
  toast('info', `ตั้งคะแนน ${val} ให้ทุกคนแล้ว`);
  renderAssessBody();
}

function bulkSetSelected(val){
  const checked = $$('.stu-check:checked').map(c=>c.dataset.sid);
  if(checked.length===0){ toast('warning','กรุณาเลือกนักเรียนก่อน'); return; }
  const {type, topicIdx} = assessState;
  const leaves = flattenLeaves([db.topics[type][topicIdx]]);
  checked.forEach(sid=>leaves.forEach(l=>{
    assessDraft[sid + '|' + l.node.id] = val;
  }));
  toast('info', `ตั้งคะแนน ${val} ให้คนที่เลือกแล้ว`);
  renderAssessBody();
}

// ตรวจสอบข้อที่ยังไม่ได้ประเมินและแสดงเป็น Modal แจ้งเตือนชัดเจน
function checkUnassessedModal(){
  const {classId, type, topicIdx} = assessState;
  const leaves = flattenLeaves([db.topics[type][topicIdx]]);
  const sts = db.students.filter(s=>s.classId===classId).sort((a,b)=>a.number-b.number);

  const missingList = [];
  sts.forEach(s=>{
    leaves.forEach(l=>{
      const key = s.id + '|' + l.node.id;
      const v = assessDraft[key];
      if(v===undefined || v===null || v===''){
        missingList.push({
          number: s.number,
          name: s.name,
          topicName: l.node.name
        });
      }
    });
  });

  if(missingList.length === 0){
    Swal.fire({
      title: 'ยอดเยี่ยมมาก! ครบทุกข้อแล้ว',
      text: 'นักเรียนทุกคนได้รับการประเมินครบทุกข้อแล้ว สามารถกดส่งข้อมูลแบบประเมินได้เลย',
      icon: 'success',
      confirmButtonText: 'รับทราบ',
      confirmButtonColor: db.settings.primary
    });
    return;
  }

  const listHtml = missingList.slice(0, 15).map(m=>`
    <tr class="border-b">
      <td class="py-1 text-center font-bold text-slate-600">${m.number}</td>
      <td class="py-1 text-left font-medium text-slate-800">${esc(m.name)}</td>
      <td class="py-1 text-left text-xs text-rose-700">${esc(m.topicName)}</td>
    </tr>
  `).join('');

  Swal.fire({
    title: `ยังมีข้อที่ยังไม่ได้ประเมินอีก ${missingList.length} จุด`,
    html: `
      <p class="text-xs text-slate-500 mb-3 text-left">ตามข้อกำหนด: <b>ต้องประเมินให้ครบทุกข้อ</b> ก่อนบันทึกข้อมูล</p>
      <div class="max-h-60 overflow-y-auto border rounded-lg p-2 text-xs">
        <table class="w-full">
          <thead>
            <tr class="bg-slate-100 font-semibold text-slate-600">
              <th class="p-1">เลขที่</th>
              <th class="p-1 text-left">ชื่อ-นามสกุล</th>
              <th class="p-1 text-left">ข้อที่ยังค้างประเมิน</th>
            </tr>
          </thead>
          <tbody>${listHtml}</tbody>
        </table>
      </div>
      ${missingList.length > 15 ? `<p class="text-[11px] text-slate-400 mt-2 text-center">...และอีก ${missingList.length - 15} รายการ</p>` : ''}
    `,
    icon: 'warning',
    confirmButtonText: 'ไปประเมินต่อ',
    confirmButtonColor: '#ef4444'
  });
}

// ฟังก์ชันกดส่งข้อมูลแบบประเมิน บันทึกลง Local และ Google Sheets อัตโนมัติ
async function submitAssessmentData(){
  const {termId, subjectId, classId, type, topicIdx} = assessState;
  const leaves = flattenLeaves([db.topics[type][topicIdx]]);
  const sts = db.students.filter(s=>s.classId===classId);

  // 1. ตรวจสอบว่าประเมินครบทุกข้อหรือไม่
  let hasMissing = false;
  sts.forEach(s=>{
    leaves.forEach(l=>{
      const v = assessDraft[s.id + '|' + l.node.id];
      if(v===undefined || v===null || v===''){
        hasMissing = true;
      }
    });
  });

  if(hasMissing){
    checkUnassessedModal();
    return;
  }

  // 2. ถามยืนยันการส่งข้อมูล
  const confirm = await Swal.fire({
    title: 'ยืนยันการบันทึกผลการประเมิน?',
    text: `ต้องการบันทึกข้อมูลนักเรียน ${sts.length} คน ลงในระบบและ Google Sheet หรือไม่?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'บันทึกข้อมูล',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: db.settings.primary
  });

  if(!confirm.isConfirmed) return;

  // 3. จัดเตรียมข้อมูลลง DB Local
  const assessmentsToSave = [];
  const logRows = [];
  let scoreSum = 0;
  let scoreCount = 0;

  sts.forEach(s=>{
    leaves.forEach(l=>{
      const score = assessDraft[s.id + '|' + l.node.id];
      const existing = db.assessments.find(a=>a.teacherId===state.user.id && a.termId===termId && a.subjectId===subjectId && a.classId===classId && a.type===type && a.studentId===s.id && a.topicId===l.node.id);
      if(existing){
        existing.score = score;
      } else {
        const newRecord = {
          id: uid(),
          teacherId: state.user.id,
          termId,
          subjectId,
          classId,
          type,
          studentId: s.id,
          topicId: l.node.id,
          score
        };
        db.assessments.push(newRecord);
      }
      assessmentsToSave.push({
        teacherId: state.user.id,
        termId,
        subjectId,
        classId,
        type,
        studentId: s.id,
        topicId: l.node.id,
        score
      });
      logRows.push({
        number: s.number,
        studentName: s.name,
        topicName: l.node.name,
        score
      });
      scoreSum += score;
      scoreCount++;
    });
  });

  const termObj = db.terms.find(t=>t.id===termId);
  const subjObj = db.subjects.find(s=>s.id===subjectId);
  const classObj = db.classes.find(c=>c.id===classId);
  const avgScore = scoreCount > 0 ? (scoreSum / scoreCount) : 0;

  // บันทึกกิจกรรมครูลง Local
  const activityLog = {
    id: uid(),
    teacherId: state.user.id,
    teacherName: state.user.name,
    term: `ภ.${termObj?.semester}/${termObj?.year}`,
    subject: subjObj?.name || '',
    className: classObj?.name || '',
    evaluatedCount: sts.length,
    avgScore: avgScore,
    timestamp: new Date().toLocaleString('th-TH')
  };
  db.activities = db.activities || [];
  db.activities.push(activityLog);

  saveDB();

  // 4. ส่งข้อมูลขึ้น Google Sheets แยกตามชีทรายห้องและบันทึกประวัติ
  Swal.fire({
    title: 'กำลังบันทึกลง Google Sheets...',
    text: 'กำลังเขียนข้อมูลลงชีทรายห้องและประวัติกิจกรรมครู',
    allowOutsideClick: false,
    didOpen: ()=>Swal.showLoading()
  });

  if(db.settings.gasApiUrl){
    const gasRes = await callGas('saveAssessments', {
      assessments: assessmentsToSave,
      className: classObj?.name || 'ห้องเรียน',
      subjectName: subjObj?.name || '',
      termName: `ภ.${termObj?.semester}/${termObj?.year}`,
      teacherName: state.user.name,
      logRows: logRows,
      activity: activityLog
    });
    Swal.close();
    if(gasRes && gasRes.status === 'success'){
      Swal.fire({
        title: 'บันทึกข้อมูลสำเร็จ!',
        html: `บันทึกข้อมูลการประเมินลงใน <b>Google Sheet</b> และแยกชีท <b>ห้อง_${esc(classObj?.name)}</b> เรียบร้อยแล้ว`,
        icon: 'success',
        confirmButtonColor: db.settings.primary
      });
    } else {
      Swal.fire({
        title: 'บันทึกในเครื่องสำเร็จ',
        text: 'บันทึกในระบบเรียบร้อย แต่ไม่สามารถเชื่อมต่อ Google Sheets ได้: ' + (gasRes?.message||''),
        icon: 'warning',
        confirmButtonColor: db.settings.primary
      });
    }
  } else {
    Swal.close();
    Swal.fire({
      title: 'บันทึกสำเร็จ',
      text: 'บันทึกข้อมูลในเครื่องเรียบร้อยแล้ว (คุณสามารถระบุ Web App URL ของ Google Sheets ในหน้าตั้งค่าเพื่อส่งข้อมูลออนไลน์)',
      icon: 'success',
      confirmButtonColor: db.settings.primary
    });
  }

  renderAssessBody();
}

function teacherProfile(){
  return `<div class="card p-6 max-w-md mx-auto">
    <h3 class="font-semibold mb-4 text-center text-base">โปรไฟล์ของฉัน</h3>
    <div class="space-y-3">
      <div class="text-center"><label class="text-xs text-slate-500">ชื่อ-นามสกุล</label><p class="font-semibold text-slate-800">${esc(state.user.name)}</p></div>
      <div class="text-center"><label class="text-xs text-slate-500">ชื่อผู้ใช้</label><p class="font-medium text-slate-700">${esc(state.user.username)}</p></div>
      ${state.user.position?`<div class="text-center"><label class="text-xs text-slate-500">ตำแหน่ง</label><p class="font-medium text-slate-700">${esc(state.user.position)}</p></div>`:''}
    </div>
    <div class="mt-6 border-t pt-4">
      <h4 class="font-semibold text-sm mb-2 text-center">เปลี่ยนรหัสผ่าน</h4>
      <input id="old-p" type="password" placeholder="รหัสผ่านเดิม" class="w-full px-3 py-2 border rounded-lg mb-2 text-sm">
      <input id="new-p" type="password" placeholder="รหัสผ่านใหม่" class="w-full px-3 py-2 border rounded-lg mb-2 text-sm">
      <input id="new-p2" type="password" placeholder="ยืนยันรหัสผ่านใหม่" class="w-full px-3 py-2 border rounded-lg mb-2 text-sm">
      <button onclick="changePassword()" class="btn-primary px-4 py-2 rounded-lg text-sm w-full font-medium">บันทึกรหัสผ่านใหม่</button>
    </div>
  </div>`;
}

function changePassword(){
  const old=$('#old-p').value, n1=$('#new-p').value, n2=$('#new-p2').value;
  if(old!==state.user.password){ toast('error','รหัสเดิมไม่ถูกต้อง'); return; }
  if(!n1||n1!==n2){ toast('error','รหัสใหม่ไม่ตรงกัน'); return; }
  state.user.password=n1; saveDB(); syncFullToGas(); toast('success','เปลี่ยนรหัสผ่านสำเร็จ');
}

// =================== HEADER ===================
function dashHeader(subtitle, role){
  const logo=db.settings.logo?`<img src="${db.settings.logo}" class="w-10 h-10 object-contain rounded-lg shadow-sm">`:`<div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-bold">ว</div>`;
  return `<header class="text-white shadow-md sticky top-0 z-30" style="background:linear-gradient(135deg, ${db.settings.primary}, ${db.settings.primary}dd)">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        ${logo}
        <div>
          <h1 class="text-sm md:text-base font-bold">ระบบประเมินสมรรถนะสำคัญของผู้เรียน</h1>
          <p class="text-xs opacity-90">${esc(subtitle)}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="sync-status-indicator"></div>
        <button onclick="syncFromGoogleSheets(false)" class="bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1" title="กดเพื่อดึงข้อมูลล่าสุด">
          🔄 ซิงก์ชีท
        </button>
        ${state.user?`<span class="text-xs opacity-90 hidden sm:inline font-medium bg-black/10 px-2 py-1 rounded">${esc(state.user.name)}</span>`:''}
        ${state.user?`<button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-xs font-medium">ออกจากระบบ</button>`:`<button onclick="navigate('home')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-xs font-medium">หน้าแรก</button>`}
      </div>
    </div>
  </header>`;
}

function logout(){
  Swal.fire({title:'ออกจากระบบ?',icon:'question',showCancelButton:true,confirmButtonText:'ออก',cancelButtonText:'ยกเลิก',confirmButtonColor:'#ef4444'})
    .then(r=>{
      if(r.isConfirmed){ state.user=null; state.view='home'; toast('success','ออกจากระบบแล้ว'); render(); }
    });
}

// =================== BOOT ===================
function boot(){
  loadDB();
  applyTheme();
  render();

  // ดึงข้อมูลจาก Google Sheets อัตโนมัติทันทีที่เปิดเว็บ (ไม่ต้องกดปุ่มเอง)
  // เพื่อให้ทุกบราวเซอร์ ทุกเครื่อง ได้ข้อมูลคะแนนและผู้ใช้ล่าสุดตรงกัน 100%
  setTimeout(()=>{
    syncFromGoogleSheets(true);
  }, 100);

  // ตั้งเวลาดึงข้อมูลใหม่อัตโนมัติทุก 45 วินาที เมื่อเปิดหน้าเว็บทิ้งไว้
  setInterval(()=>{
    syncFromGoogleSheets(true);
  }, 45000);
}
boot();
</script>
</body>
</html>
