async function confirmDel(text='ต้องการลบข้อมูลนี้หรือไม่?'){
  const r=await Swal.fire({
    icon:'warning',

}

async function confirmQuickAdd(text='ตั้งค่าระดับคะแนนให้ทุกคนในห้อง?'){

    icon:'question',

/* =========================================================
   MODAL
========================================================= */
let modalEl=null;
function modal({title,body,size='max-w-lg',okText='บันทึก',hideOk=false,onOk}){
  closeModal();
  modalEl=document.createElement('div');
  modalEl.className='fixed inset-0 z-[60] flex items-start justify-center p-3 sm:p-6 overflow-y-auto bg-slate-900/50 backdrop-blur-sm';
  modalEl.innerHTML=`
    <div class="w-full ${size} bg-white rounded-2xl shadow-2xl my-4 animate-pop">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
        <h3 class="font-bold text-slate-800 text-[15px]">${title}</h3>
        <button class="btn-icon" data-close><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 max-h-[70vh] overflow-y-auto scrollbar" data-body>${body}</div>
      <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2">
        <button class="btn btn-ghost" data-close>ยกเลิก</button>
        ${hideOk?'':'<button class="btn btn-primary" data-ok>'+okText+'</button>'}
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  document.body.style.overflow='hidden';
  modalEl.addEventListener('click',async e=>{
    if(e.target===modalEl||e.target.closest('[data-close]')) return closeModal();
    const ok=e.target.closest('[data-ok]');
    if(ok){
      ok.disabled=true;
      const old=ok.innerHTML;
      ok.innerHTML='<i class="fa-solid fa-circle-notch spin"></i> กำลังบันทึก';
      try{
        const res=await onOk?.();
        if(res===false){ ok.disabled=false; ok.innerHTML=old; }
        else closeModal();
      }catch(err){ console.error(err); ok.disabled=false; ok.innerHTML=old; alertErr('เกิดข้อผิดพลาด',String(err.message||err)); }
    }
  });
}
function closeModal(){
  if(modalEl){ modalEl.remove(); modalEl=null; document.body.style.overflow=''; }
}

    leaves.forEach(l=>{ sc[l.node.id]=Math.max(0,Math.min(3,3-(idx%3))); });
    d.evals[a1.id][st.id]=sc;
  });
  return d;
}

function loadDB(){

  updateSyncBadge();
}

function saveDB(syncToGas=false){

async function syncWithGoogleSheet(silent=false){
  if(!DB.settings?.gasUrl){
    if(!silent) alertErr('ยังไม่ได้ตั้งค่า Google Sheets URL','กรุณาไปที่เมนู "ตั้งค่า" แล้วระบุ URL ของ Web App');
    return false;
  }
  const badge=$('#syncBadge');
  if(badge) badge.innerHTML='<i class="fa-solid fa-arrows-rotate spin text-emerald-600"></i> กำลังซิงค์...';
  try{
    const res=await fetch(DB.settings.gasUrl,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'syncAll',data:DB})
    });
    const result=await res.json();
    if(result.status==='success'){
      if(badge) badge.innerHTML='<i class="fa-solid fa-cloud-check text-emerald-600"></i> ซิงค์ชีทแล้ว';
      if(!silent) toast('success','ซิงค์ข้อมูลกับ Google Sheets สำเร็จ');
      return true;
    }else{
      throw new Error(result.message||'Sync failed');
    }
  }catch(err){
    console.error(err);
    if(badge) badge.innerHTML='<i class="fa-solid fa-cloud-arrow-up text-amber-500"></i> ออฟไลน์ (เก็บในเครื่อง)';
    if(!silent) alertErr('เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets',err.message);
    return false;
  }
}

async function uploadFileToDrive(file){
  if(!DB.settings?.gasUrl){
    // Fallback if no GAS URL configured yet: use local DataURL
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
  }
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        Swal.fire({title:'กำลังอัปโหลดไปยัง Google Drive...',text:'บันทึกลงโฟลเดอร์ '+DB.settings.driveFolderId,didOpen:()=>Swal.showLoading(),allowOutsideClick:false});
        const res=await fetch(DB.settings.gasUrl,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({
            action:'uploadFile',
            base64:reader.result,
            fileName:file.name,
            mimeType:file.type
          })
        });
        const json=await res.json();
        Swal.close();
        if(json.status==='success'&&json.url){
          resolve(json.url);
        }else{
          // Fallback to local DataURL if drive fails
          console.warn('Drive upload failed, using DataURL fallback:',json.message);
          resolve(reader.result);
        }
      }catch(e){
        Swal.close();
        console.warn('Drive upload network error, fallback:',e);
        resolve(reader.result);
      }
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function shade(hex,pct){
  const h=hex.replace('#','');
  const num=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  const f=v=>{ const n=pct<0? v*(100+pct)/100 : v+(255-v)*pct/100; return Math.max(0,Math.min(255,Math.round(n))); };
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

========================================================= */
function qualityOf(avg){
  if(avg===null||avg===undefined||isNaN(avg)) return {level:null,label:'ยังไม่มีข้อมูล',cls:'bg-slate-100 text-slate-500'};
  if(avg>=2.5) return {level:3,label:'ดีเยี่ยม',cls:'bg-emerald-100 text-emerald-700'};
  if(avg>=1.5) return {level:2,label:'ดี',cls:'bg-sky-100 text-sky-700'};
  if(avg>=0.5) return {level:1,label:'พอใช้/ผ่านเกณฑ์',cls:'bg-amber-100 text-amber-700'};
  return {level:0,label:'ปรับปรุง',cls:'bg-rose-100 text-rose-700'};
}
function qBadge(avg){
  const q=qualityOf(avg);
  if(q.level===null) return `<span class="badge ${q.cls}">— ยังไม่มีข้อมูล</span>`;
  return `<span class="badge ${q.cls}"><b>${q.level}</b> ${q.label}</span>`;
}
function classOf(id){ return DB.classes.find(c=>c.id===id); }
function groupOfLevel(l){ return JUNIOR.includes(l)?'junior':'senior'; }
function groupOfClass(c){ return c?groupOfLevel(c.level):'junior'; }
function assignGroup(a){ return groupOfClass(classOf(a.classId)); }
function studentsOf(classId){ return DB.students.filter(s=>s.classId===classId).sort((a,b)=>(a.no||0)-(b.no||0)); }
function semLabel(s){ return s?`ภาคเรียนที่ ${s.term}/${s.year}`:'-'; }
function currentSem(){ return DB.semesters.find(s=>s.current)||DB.semesters[0]||null; }

function flattenLeaves(node,prefix='',out=[]){
  const kids=node.children||[];
  if(!kids.length){ out.push({node,code:prefix||'•'}); return out; }
  kids.forEach((c,i)=>{
    const code=prefix?`${prefix}.${i+1}`:String(i+1);
    flattenLeaves(c,code,out);
  });
  return out;
}
function allLeavesOf(group){
  const out=[];
  (DB.topics[group]||[]).forEach(t=>flattenLeaves(t,'',out));
  return out;
}
function nodeAvg(node,scores){
  const kids=node.children||[];
  if(!kids.length){
    const v=scores[node.id];
    return (v===undefined||v===null||v==='')?null:Number(v);
  }
  const vals=kids.map(c=>nodeAvg(c,scores)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function setScore(assignId,studentId,topicId,val){
  if(!DB.evals[assignId]) DB.evals[assignId]={};
  if(!DB.evals[assignId][studentId]) DB.evals[assignId][studentId]={};
  if(val===null||val===undefined||val==='') delete DB.evals[assignId][studentId][topicId];
  else DB.evals[assignId][studentId][topicId]=Number(val);
}
function getScore(assignId,studentId,topicId){
  const v=DB.evals?.[assignId]?.[studentId]?.[topicId];
  return (v===undefined)?null:v;
}
function studentAssignAvg(assignId,studentId){
  const a=DB.assignments.find(x=>x.id===assignId); if(!a) return null;
  const g=assignGroup(a);
  const scores=DB.evals?.[assignId]?.[studentId]||{};
  const tops=DB.topics[g]||[];
  const vals=tops.map(t=>nodeAvg(t,scores)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((x,y)=>x+y,0)/vals.length;
}
function studentAssignedCount(assignId,studentId){
  const a=DB.assignments.find(x=>x.id===assignId); if(!a) return {done:0,total:0};
  const leaves=allLeavesOf(assignGroup(a));
  const scores=DB.evals?.[assignId]?.[studentId]||{};
  let done=0;
  leaves.forEach(l=>{ if(scores[l.node.id]!==undefined) done++; });
  return {done,total:leaves.length};
}
function collectStats(semId){
  const res={all:[],junior:[],senior:[],levels:{},classes:{},perAssign:{}};
  const assigns=DB.assignments.filter(a=>a.semesterId===semId);
  for(const a of assigns){
    const cls=classOf(a.classId); if(!cls) continue;
    const g=groupOfClass(cls);
    const arr=[];
    for(const st of studentsOf(cls.id)){
      const avg=studentAssignAvg(a.id,st.id);
      if(avg===null) continue;
      res.all.push(avg); res[g].push(avg); arr.push(avg);
      (res.levels[cls.level]=res.levels[cls.level]||[]).push(avg);
      (res.classes[cls.id]=res.classes[cls.id]||[]).push(avg);
    }
    res.perAssign[a.id]=arr;
  }
  return res;
}
function logAct(text){

    nums.push(`<button class="w-8 h-8 rounded-lg text-xs font-bold ${i===info.page?'text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}" ${i===info.page?'style="background:var(--primary)"':''} data-pgkey="${key}" data-pgto="${i}">${i+1}</button>`);

      ${nums.join('')}
      <button class="btn btn-ghost btn-xs" data-pgkey="${key}" data-pgto="next" ${info.page>=info.totalPages-1?'disabled style="opacity:.4"':''}><i class="fa-solid fa-chevron-right"></i></button>

}
function slicePage(arr,key,size=10){
  const st=PG[key]||(PG[key]={p:0});
  const totalPages=Math.max(1,Math.ceil(arr.length/size));
  if(st.p>=totalPages) st.p=totalPages-1;
  if(st.p<0) st.p=0;
  const start=st.p*size;
  return {items:arr.slice(start,start+size),start,page:st.p,totalPages,total:arr.length};
}

function statCard(title,avg,icon,count){

function drawDashboardCharts(st){
  const labels=LEVELS.filter(l=>st.levels[l]);
  const data=labels.map(l=>mean(st.levels[l]));
  const colors=['#34d399','#4ade80','#86efac','#60a5fa','#38bdf8','#a5b4fc'];
  if(charts.chartLevel) charts.chartLevel.destroy();
  const c1=$('#chartLevel');
  if(c1){
    charts.chartLevel=new Chart(c1,{
      type:'bar',
      data:{labels:labels.length?labels:['ยังไม่มีข้อมูล'],datasets:[{
        label:'ค่าเฉลี่ย',data:data.length?data:[0],
        backgroundColor:labels.map((_,i)=>colors[i%colors.length]),borderRadius:8,barThickness:38
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>`ค่าเฉลี่ย ${Number(c.raw).toFixed(2)} (${qualityOf(Number(c.raw)).label})`}}},
        scales:{y:{min:0,max:3,ticks:{stepSize:1}},x:{grid:{display:false}}}}
    });
  }
  const counts=[0,0,0,0];
  st.all.forEach(a=>{ const q=qualityOf(a); if(q.level!==null) counts[q.level]++; });
  if(charts.chartQuality) charts.chartQuality.destroy();
  const c2=$('#chartQuality');
  if(c2){
    charts.chartQuality=new Chart(c2,{
      type:'doughnut',
      data:{labels:['3 ดีเยี่ยม','2 ดี','1 พอใช้/ผ่านเกณฑ์','0 ปรับปรุง'],
        datasets:[{data:counts,backgroundColor:['#34d399','#60a5fa','#fbbf24','#fb7185'],borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}
    });
  }
  drawClassChart(st);
}
function drawClassChart(st){
  const c=$('#chartClass'); if(!c) return;
  if(charts.chartClass) charts.chartClass.destroy();
  const sel=DASH.classSel.filter(id=>DB.classes.find(x=>x.id===id));
  if(!sel.length){
    charts.chartClass=new Chart(c,{type:'bar',data:{labels:[],datasets:[]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        title:{display:true,text:'กรุณาเลือกชั้นเรียนด้านบนเพื่อแสดงข้อมูล',color:'#94a3b8',font:{size:12}}},
        scales:{y:{min:0,max:3}}}});
    return;
  }
  const labels=sel.map(id=>classOf(id)?.name||'-');
  const data=sel.map(id=>mean(st.classes[id]||[]));
  charts.chartClass=new Chart(c,{
    type:'bar',
    data:{labels,datasets:[{label:'ค่าเฉลี่ย',data:data.map(v=>v??0),backgroundColor:'#34d399',borderRadius:8,barThickness:42}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:x=>`ค่าเฉลี่ย ${Number(x.raw).toFixed(2)} (${qualityOf(Number(x.raw)).label})`}}},
      scales:{y:{min:0,max:3,ticks:{stepSize:1}},x:{grid:{display:false}}}}
  });
}

function semForm(s){
  const isEdit=!!s;
  modal({
    title:isEdit?'แก้ไขภาคเรียน':'เพิ่มภาคเรียน',
    size:'max-w-sm',
    body:`<div class="space-y-3">
      <div><label class="lbl">ภาคเรียนที่</label>
        <select id="fT" class="inp"><option value="1" ${isEdit&&s.term==1?'selected':''}>1</option><option value="2" ${isEdit&&s.term==2?'selected':''}>2</option></select></div>
      <div><label class="lbl">ปีการศึกษา (พ.ศ.)</label><input id="fY" type="number" class="inp" value="${isEdit?s.year:new Date().getFullYear()+543}" min="2500" max="2700"></div>
      <label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" id="fC" class="w-4 h-4 accent-green-600" ${isEdit&&s.current?'checked':''}> ตั้งเป็นภาคเรียนปัจจุบัน</label>
    </div>`,
    onOk:()=>{
      const term=Number($('#fT').value), year=Number($('#fY').value), cur=$('#fC').checked;
      if(!year){ alertErr('ข้อมูลไม่ครบ','กรุณากรอกปีการศึกษา'); return false; }
      if(isEdit){ Object.assign(s,{term,year}); }
      else { DB.semesters.push({id:uid(),term,year,current:false}); }
      if(cur) DB.semesters.forEach(x=>x.current=(x.id===(isEdit?s.id:DB.semesters[DB.semesters.length-1].id)));
      if(!DB.semesters.some(x=>x.current)) DB.semesters[0].current=true;
      logAct(isEdit?'แก้ไขภาคเรียน':'เพิ่มภาคเรียน'); saveDB(true); go('semesters'); toast('success','บันทึกแล้ว');
    }
  });
}

function classForm(c){

    body:`<div class="space-y-3">
      <div><label class="lbl">ระดับชั้น</label>
        <select id="cl" class="inp">${LEVELS.map(l=>`<option value="${l}" ${isEdit&&c.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label class="lbl">ชื่อชั้น (เช่น ม.1/1)</label><input id="cn" class="inp" value="${isEdit?esc(c.name):''}" placeholder="เช่น ม.1/1"></div>
    </div>`,
    onOk:()=>{
      const level=$('#cl').value, name=$('#cn').value.trim();
      if(!name){ alertErr('ข้อมูลไม่ครบ','กรุณากรอกชื่อชั้น'); return false; }
      if(isEdit) Object.assign(c,{level,name});
      else DB.classes.push({id:uid(),level,name});
      logAct(isEdit?'แก้ไขชั้นเรียน':'เพิ่มชั้นเรียน '+name); saveDB(true); go('classes'); toast('success','บันทึกแล้ว');

}
function pageStudents(el){
  const c=classOf(App.params.classId);
  if(!c){ el.innerHTML='<div class="card p-8 text-center text-slate-400">ไม่พบชั้นเรียน</div>'; return; }
  const list=studentsOf(c.id);
  const info=slicePage(list,'students',10);
  el.innerHTML=`<div class="fade-in space-y-4">
    <div class="flex items-center gap-2">
      <button class="btn-icon" id="back"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="flex-1">
        <h2 class="text-lg font-bold text-slate-800">${esc(c.name)} <span class="badge bg-slate-100 text-slate-600 ml-1">${esc(c.level)}</span></h2>
        <p class="text-xs text-slate-500">นักเรียนทั้งหมด ${list.length} คน</p>
      </div>
      <div class="flex gap-2 flex-wrap justify-end">
        <button class="btn btn-ghost btn-sm" id="impExcel"><i class="fa-solid fa-file-excel"></i> นำเข้า Excel</button>
        <button class="btn btn-ghost btn-sm" id="addMany"><i class="fa-solid fa-list-ol"></i> เพิ่มหลายคน</button>
        <button class="btn btn-primary btn-sm" id="addOne"><i class="fa-solid fa-plus"></i> เพิ่มนักเรียน</button>
      </div>
    </div>
    <div class="card overflow-hidden">
      <div class="overflow-x-auto scrollbar">
        <table class="tbl">
          <thead><tr><th>#</th><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th class="text-right">จัดการ</th></tr></thead>
          <tbody>
            ${info.items.map((s,i)=>`<tr>
              <td class="text-slate-400">${info.start+i+1}</td>
              <td class="font-semibold">${s.no||'-'}</td>
              <td class="font-medium">${esc(s.name)}</td>
              <td class="text-right whitespace-nowrap">
                <button class="btn-icon" data-ed="${s.id}"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-icon text-rose-500" data-dd="${s.id}"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>`).join('')||'<tr><td colspan="4" class="text-center text-slate-400 py-8">ยังไม่มีนักเรียน</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    ${pagerHTML('students',info)}
    <input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" class="hidden">
  </div>`;

  $('#back').onclick=()=>go('classes');
  $('#addOne').onclick=()=>stuForm(c,null);
  $$('[data-ed]').forEach(b=>b.onclick=()=>stuForm(c,DB.students.find(s=>s.id===b.dataset.ed)));
  $$('[data-dd]').forEach(b=>b.onclick=async()=>{
    const s=DB.students.find(x=>x.id===b.dataset.dd);
    if(await confirmDel(`ลบนักเรียน "${s.name}"?`)){
      DB.students=DB.students.filter(x=>x.id!==s.id);
      Object.values(DB.evals).forEach(m=>{ delete m[s.id]; });
      logAct('ลบนักเรียน '+s.name); saveDB(true); go('students',{classId:c.id}); toast('success','ลบแล้ว');
    }
  });
  $('#addMany').onclick=()=>{
    modal({title:'เพิ่มนักเรียนหลายคน',size:'max-w-md',
      body:`<p class="text-xs text-slate-500 mb-2">หนึ่งบรรทัดต่อหนึ่งคน รูปแบบ: <b>เลขที่ ชื่อ-นามสกุล</b> (หรือใส่เฉพาะชื่อก็ได้)</p>
        <textarea id="many" class="inp" rows="8" placeholder="1 เด็กชายสมชาย ใจดี&#10;2 เด็กหญิงสมศรี รักเรียน"></textarea>`,
      onOk:()=>{
        const lines=$('#many').value.split('\n').map(l=>l.trim()).filter(Boolean);
        if(!lines.length){ alertErr('ไม่มีข้อมูล','กรุณากรอกรายชื่อ'); return false; }
        let no=(studentsOf(c.id).reduce((m,s)=>Math.max(m,s.no||0),0));
        lines.forEach(l=>{
          const m=l.match(/^(\d+)[\s.\-]+(.+)$/);
          if(m) DB.students.push({id:uid(),classId:c.id,no:Number(m[1]),name:m[2].trim()});
          else DB.students.push({id:uid(),classId:c.id,no:++no,name:l});
        });
        logAct(`เพิ่มนักเรียน ${lines.length} คน ใน ${c.name}`); saveDB(true); go('students',{classId:c.id}); toast('success',`เพิ่ม ${lines.length} รายชื่อแล้ว`);
      }});
  };
  $('#impExcel').onclick=()=>$('#fileExcel').click();
  $('#fileExcel').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      Swal.fire({title:'กำลังนำเข้าข้อมูล...',didOpen:()=>Swal.showLoading(),allowOutsideClick:false});
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
      let added=0, no=studentsOf(c.id).reduce((m,s)=>Math.max(m,s.no||0),0);
      rows.forEach(r=>{
        const cells=r.map(x=>String(x??'').trim()).filter(Boolean);
        if(!cells.length) return;
        if(cells.some(x=>/ชื่อ|นามสกุล|name/i.test(x)) && cells.length<=3) return;
        let n=null,num=null;
        if(/^\d+$/.test(cells[0])){ num=Number(cells[0]); n=cells.slice(1).join(' ').trim(); }
        else n=cells.join(' ').trim();
        if(!n||n.length<2) return;
        DB.students.push({id:uid(),classId:c.id,no:num||++no,name:n});
        added++;
      });
      Swal.close();
      if(!added){ alertErr('ไม่พบข้อมูล','ไม่พบรายชื่อที่สามารถนำเข้าได้'); return; }
      logAct(`นำเข้านักเรียน ${added} คน ใน ${c.name}`); saveDB(true); go('students',{classId:c.id});
      alertOk('นำเข้าสำเร็จ',`เพิ่มนักเรียน ${added} รายชื่อ`);
    }catch(err){ Swal.close(); alertErr('เกิดข้อผิดพลาด',String(err.message||err)); }
  };
}

      <div><label class="lbl">ชื่อ-นามสกุล</label><input id="snm" class="inp" value="${isEdit?esc(s.name):''}" placeholder="เช่น เด็กชายสมชาย ใจดี"></div>
    </div>`,
    onOk:()=>{
      const no=Number($('#sno').value)||0, nm=$('#snm').value.trim();
      if(!nm){ alertErr('ข้อมูลไม่ครบ','กรุณากรอกชื่อนักเรียน'); return false; }

function assignProgress(assignId){
  const a=DB.assignments.find(x=>x.id===assignId); if(!a) return {pct:0};
  const sts=studentsOf(a.classId);
  const leaves=allLeavesOf(assignGroup(a));
  const total=sts.length*leaves.length;
  if(!total) return {pct:0};
  let done=0;
  sts.forEach(s=>leaves.forEach(l=>{ if(getScore(a.id,s.id,l.node.id)!==null) done++; }));
  return {pct:Math.round(done/total*100),done,total};
}

    }

function findNode(list,id){
  for(const n of list){
    if(n.id===id) return n;
    const f=findNode(n.children||[],id);
    if(f) return f;
  }
  return null;
}
function nodeLevel(list,id,lvl=1){
  for(const n of list){
    if(n.id===id) return lvl;
    const r=nodeLevel(n.children||[],id,lvl+1);
    if(r) return r;
  }
  return 0;
}
function removeNode(list,id){
  for(let i=0;i<list.length;i++){
    if(list[i].id===id){ list.splice(i,1); return true; }
    if(removeNode(list[i].children||[],id)) return true;
  }
  return false;
}
function topicNodeHTML(n,lvl,g){
  const colors=['','bg-emerald-50 text-emerald-700','bg-sky-50 text-sky-700','bg-amber-50 text-amber-700','bg-violet-50 text-violet-700','bg-rose-50 text-rose-700'];
  return `<div class="tl-row" style="margin-left:${(lvl-1)*18}px">
    <span class="badge ${colors[lvl]} shrink-0 mt-0.5">ระดับ ${lvl}</span>
    <div class="flex-1 min-w-0">
      <p class="text-[13px] font-medium text-slate-700 leading-snug">${esc(n.name)}</p>
      <div class="flex gap-1 mt-1">
        ${lvl<5?`<button class="btn btn-ghost btn-xs" data-tadd="${n.id}"><i class="fa-solid fa-plus"></i> หัวข้อย่อย</button>`:''}
        <button class="btn btn-ghost btn-xs" data-tedit="${n.id}"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-ghost btn-xs text-rose-500" data-tdel="${n.id}"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  </div>${(n.children||[]).map(c=>topicNodeHTML(c,lvl+1,g)).join('')}`;
}
function topicForm(g,parent,lvl,isEdit){
  modal({
    title:isEdit?'แก้ไขหัวข้อประเมิน':(parent?`เพิ่มหัวข้อย่อย (ระดับ ${lvl})`:'เพิ่มหัวข้อใหญ่'),

      else { DB.topics[g].push({id:uid(),name:v,children:[]}); }

    }
  });
}

      </div>
    </div>
  </div>`;

  // Test GAS Web App
  $('#btnTestGas').onclick=async()=>{
    const url=$('#gasUrlInput').value.trim();
    if(!url){ alertErr('กรุณากรอก URL','ระบุ Google Apps Script Web App URL ก่อนกดทดสอบ'); return; }
    Swal.fire({title:'กำลังทดสอบการเชื่อมต่อ...',didOpen:()=>Swal.showLoading(),allowOutsideClick:false});
    try{
      const res=await fetch(url+(url.includes('?')?'&':'?')+'action=ping');
      const data=await res.json();
      Swal.close();
      if(data.status==='success'){
        DB.settings.gasUrl=url;
        saveDB();
        alertOk('เชื่อมต่อ Google Sheets สำเร็จ!','ระบบสื่อสารกับ Google Apps Script เรียบร้อยแล้ว');
      }else{
        alertErr('ตอบกลับไม่ถูกต้อง',JSON.stringify(data));
      }
    }catch(err){
      Swal.close();
      alertErr('เชื่อมต่อไม่สำเร็จ',err.message+' (โปรดตรวจสอบว่าตอน Deploy Apps Script ได้ตั้งค่า Who has access เป็น "Anyone" หรือไม่)');
    }
  };

  // Sync Now
  $('#btnSyncNow').onclick=async()=>{
    const ok=await syncWithGoogleSheet(false);
    if(ok) toast('success','ข้อมูลและชีทแยกแต่ละห้องเรียนถูกอัปเดตแล้ว');
  };

  // Logo upload to Google Drive
  $('#pickLogo').onclick=()=>$('#logoFile').click();
  $('#logoFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>5*1024*1024){ alertErr('ไฟล์ใหญ่เกินไป','กรุณาใช้รูปขนาดไม่เกิน 5 MB'); return; }
    try{
      const url=await uploadFileToDrive(f);
      DB.settings.logo=url;
      saveDB(true);
      applyTheme();
      go('settings');
      toast('success','บันทึกโลโก้ลง Google Drive แล้ว');
    }catch(err){
      alertErr('เกิดข้อผิดพลาดในการอัปโหลด',err.message);
    }
  };

  const rm=$('#rmLogo');
  if(rm) rm.onclick=async()=>{ if(await confirmDel('ลบโลโก้ปัจจุบัน?')){ DB.settings.logo=''; saveDB(true); applyTheme(); go('settings'); } };
  
  $$('[data-preset]').forEach(b=>b.onclick=()=>{
    const [p,a]=b.dataset.preset.split('|');
    $('#cPrimary').value=p; $('#cAccent').value=a;
  });

  $('#saveTheme').onclick=()=>{
    DB.settings.gasUrl=$('#gasUrlInput').value.trim();
    DB.settings.primary=$('#cPrimary').value;
    DB.settings.accent=$('#cAccent').value;
    saveDB(true);
    applyTheme();
    toast('success','บันทึกการตั้งค่าแล้ว');
  };
}

      <div class="card overflow-hidden shadow-sm">
        <div class="overflow-auto scrollbar" style="max-height:65vh">
          <table class="tbl">
            <thead style="position:sticky;top:0;z-index:15" class="shadow-xs">

function bindEval(assign){
  const group=assignGroup(assign);
  const tops=DB.topics[group]||[];
  const top=tops.find(t=>t.id===EV.topId)||tops[0];
  if(!top) return;
  const leaves=flattenLeaves(top);
  const sts=studentsOf(assign.classId);

  // เลื่อนคอลัมน์เมื่อคลิกที่ Sidebar ด้านซ้าย
  $$('[data-scroll-to-col]').forEach(item=>{
    item.onclick=()=>{
      const cid=item.dataset.scrollToCol;
      const th=$(`th[data-col-target="${cid}"]`);
      if(th){
        th.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
        th.classList.add('bg-amber-100');
        setTimeout(()=>th.classList.remove('bg-amber-100'),1500);
      }
    };
  });

  const refreshRow=(sid)=>{
    const tr=$(`tr[data-row="${sid}"]`);
    if(!tr) return;
    const cnt=studentAssignedCount(assign.id,sid);
    const avg=studentAssignAvg(assign.id,sid);
    const nameCell=tr.children[2];
    const sumCell=tr.querySelector(`[data-summary="${sid}"]`);
    const small=nameCell.querySelector('p:last-child');
    if(small){
      small.className=`text-[10px] mt-0.5 ${cnt.done<cnt.total?'text-amber-600 font-medium':'text-emerald-600 font-medium'}`;
      small.innerHTML=cnt.done<cnt.total?`<i class="fa-solid fa-triangle-exclamation"></i> ค้าง ${cnt.total-cnt.done} ข้อ`:`<i class="fa-solid fa-circle-check"></i> ครบทุกข้อ`;
    }
    if(sumCell) sumCell.innerHTML=`<div class="flex flex-col items-center gap-0.5"><span class="font-extrabold text-sm" style="color:var(--primary-d)">${fmt(avg)}</span>${qBadge(avg)}</div>`;
  };

  const refreshClassAvg=()=>{
    const vals=sts.map(s=>studentAssignAvg(assign.id,s.id)).filter(v=>v!==null);
    const av=mean(vals);
    const box=$('#classAvgBox');
    if(box) box.innerHTML=`<span class="text-xs font-semibold text-slate-500">คะแนนเฉลี่ยรวมทั้งห้อง:</span> <span class="text-2xl font-extrabold" style="color:var(--primary-d)">${fmt(av)}</span> ${qBadge(av)}`;
  };

  // จัดการเปลี่ยนค่า select คะแนนเดี่ยว
  const handler=(e)=>{
    const sel=e.target.closest('.score-sel');
    if(sel && $('#app').contains(sel)){
      const {a,s,t}=sel.dataset;
      setScore(a,s,t,sel.value===''?null:Number(sel.value));
      sel.className='score-sel '+(sel.value===''?'sn':'s'+sel.value);
      saveDB();
      refreshRow(s);
      refreshClassAvg();
    }
  };
  document.removeEventListener('change',window.__evalHandler||(()=>{}));
  window.__evalHandler=handler;
  document.addEventListener('change',handler);

  // กำหนดคะแนนด่วนทั้งแถวของนักเรียน
  $$('[data-rowset]').forEach(b=>b.onclick=()=>{
    const sid=b.dataset.rowset, v=Number(b.dataset.v);
    leaves.forEach(l=>{
      setScore(assign.id,sid,l.node.id,v);
      const sel=$(`.score-sel[data-s="${sid}"][data-t="${l.node.id}"]`);
      if(sel){ sel.value=String(v); sel.className='score-sel s'+v; }
    });
    saveDB();
    refreshRow(sid);
    refreshClassAvg();
    toast('success','กำหนดระดับ '+v+' ทั้งแถวเรียบร้อย');
  });

  // เช็คบ็อกซ์เลือกรายบุคคล
  const updChk=()=>{
    const n=$$('.ev-chk:checked').length;
    const c=$('#chkCount');
    if(c) c.textContent=`เลือก ${n} คน`;
    const selAll=$('#chkSelectAllRows');
    if(selAll) selAll.checked=(n>0 && n===sts.length);
  };
  $$('.ev-chk').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) EV.checks.add(cb.dataset.sid); else EV.checks.delete(cb.dataset.sid);
    updChk();
  });
  $('#chkSelectAllRows')?.addEventListener('change',e=>{
    const checked=e.target.checked;
    $$('.ev-chk').forEach(cb=>{
      cb.checked=checked;
      if(checked) EV.checks.add(cb.dataset.sid); else EV.checks.delete(cb.dataset.sid);
    });
    updChk();
  });
  updChk();

  // กำหนดคะแนนเฉพาะคนที่เลือก
  $$('[data-selall]').forEach(b=>b.onclick=()=>{
    const v=Number(b.dataset.selall);
    const sids=[...EV.checks];
    if(!sids.length){ alertErr('ยังไม่ได้เลือกนักเรียน','กรุณาติ๊กเครื่องหมายถูกหน้ารายชื่อนักเรียนที่ต้องการกำหนด'); return; }
    sids.forEach(sid=>{
      leaves.forEach(l=>{
        setScore(assign.id,sid,l.node.id,v);
        const sel=$(`.score-sel[data-s="${sid}"][data-t="${l.node.id}"]`);
        if(sel){ sel.value=String(v); sel.className='score-sel s'+v; }
      });
      refreshRow(sid);
    });
    saveDB();
    refreshClassAvg();
    toast('success',`กำหนดระดับ ${v} ให้ ${sids.length} คนเรียบร้อยแล้ว`);
  });

  // กำหนดคะแนนทั้งห้อง (แก้ไขตามคำขอ: เปลี่ยนเป็น "ยืนยันการเพิ่มข้อมูลทั้งห้อง" และปุ่ม "ยืนยันการเพิ่มข้อมูล")
  $$('[data-all]').forEach(b=>b.onclick=async()=>{
    const v=Number(b.dataset.all);
    const confirmed = await confirmQuickAdd(`ต้องการกำหนดระดับคะแนน ${v} ให้แก่นักเรียนทุกคนในห้อง (${leaves.length} ตัวชี้วัด × ${sts.length} คน)?`);
    if(!confirmed) return;
    
    sts.forEach(st=>{
      leaves.forEach(l=>{
        setScore(assign.id,st.id,l.node.id,v);
      });
    });
    saveDB();
    go('eval');
    toast('success',`กำหนดระดับ ${v} ให้ทุกคนในห้องเรียบร้อยแล้ว`);
  });

  // ปุ่มบันทึกการประเมิน
  const saveBtn=$('#btnSaveEval');
  if(saveBtn) saveBtn.onclick=async()=>{
    const old=saveBtn.innerHTML;
    saveBtn.innerHTML='<i class="fa-solid fa-circle-notch spin"></i> กำลังบันทึก...';
    saveBtn.disabled=true;
    logAct('บันทึกผลการประเมิน '+ (DB.subjects.find(s=>s.id===assign.subjectId)?.name||''));
    saveDB(true); // บันทึกลง LocalStorage และ Auto Sync Google Sheets
    await sleep(400);
    saveBtn.innerHTML=old; saveBtn.disabled=false;
    alertOk('บันทึกการประเมินสำเร็จ','ข้อมูลบันทึกและส่งข้อมูลเข้า Google Sheets เรียบร้อยแล้ว');
  };

  // ปุ่มส่งข้อมูลเข้า Google Sheet ทันที
  $('#btnSyncEvalSheet')?.addEventListener('click',async()=>{
    await syncWithGoogleSheet(false);
  });
}

function pageAccount(el){
  const u=DB.users.find(x=>x.id===SESSION.id);
  const myAssigns=DB.assignments.filter(a=>a.teacherId===u.id);
  const sem=currentSem();
  const inSem=myAssigns.filter(a=>a.semesterId===sem?.id);
  const done=inSem.filter(a=>assignProgress(a.id).pct===100).length;

  el.innerHTML=`<div class="fade-in space-y-4 max-w-2xl">
    <div><h2 class="text-lg font-bold text-slate-800">บัญชีของฉัน</h2>
      <p class="text-xs text-slate-500">ข้อมูลส่วนตัวและความปลอดภัย</p></div>
    <div class="card p-5">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-extrabold text-white shadow-sm" style="background:var(--primary)">${esc(u.name.charAt(0))}</div>
        <div>
          <p class="font-bold text-slate-800 text-base">${esc(u.name)}</p>
          <p class="text-xs text-slate-500">${esc(u.position||'ครู')} · ชื่อผู้ใช้: ${esc(u.username)}</p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-4 text-center">
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${myAssigns.length}</p><p class="text-[11px] text-slate-500">รายวิชาที่สอน</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${inSem.length}</p><p class="text-[11px] text-slate-500">ภาคเรียนปัจจุบัน</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${done}</p><p class="text-[11px] text-slate-500">ประเมินครบแล้ว</p></div>
      </div>
    </div>
    <div class="card p-5">
      <h3 class="font-bold text-sm text-slate-700 mb-3"><i class="fa-solid fa-key mr-1" style="color:var(--accent)"></i> เปลี่ยนรหัสผ่าน</h3>
      <div class="space-y-3">
        <div><label class="lbl">รหัสผ่านเดิม</label><input id="op" type="password" class="inp"></div>
        <div><label class="lbl">รหัสผ่านใหม่</label><input id="npw" type="password" class="inp"></div>
        <div><label class="lbl">ยืนยันรหัสผ่านใหม่</label><input id="cpw" type="password" class="inp"></div>
        <button class="btn btn-primary" id="chgPass"><i class="fa-solid fa-floppy-disk"></i> เปลี่ยนรหัสผ่าน</button>
      </div>
    </div>
  </div>`;
  $('#chgPass').onclick=()=>{
    const o=$('#op').value, n=$('#npw').value, c=$('#cpw').value;
    if(o!==u.password){ alertErr('รหัสผ่านเดิมไม่ถูกต้อง'); return; }
    if(n.length<4){ alertErr('รหัสผ่านสั้นเกินไป','อย่างน้อย 4 ตัวอักษร'); return; }
    if(n!==c){ alertErr('รหัสผ่านใหม่ไม่ตรงกัน'); return; }
    u.password=n; saveDB(true); alertOk('เปลี่ยนรหัสผ่านสำเร็จ');
    $('#op').value=$('#npw').value=$('#cpw').value='';
  };
}
