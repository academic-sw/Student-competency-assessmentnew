<script>
/* =========================================================
   ★ ตั้งค่า: วาง URL ของ Web App (Apps Script) ที่ลงท้ายด้วย /exec
========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyrka9oJSM8zdDe3LtsusRzaB2Ej3zCLUaZJ5qN8DxdMiz0o--YyT-j6QeI1TdvUJTXmw/exec';

/* =========================================================
   UTILITIES
========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmt=n=>(n===null||n===undefined||isNaN(n))?'—':Number(n).toFixed(2);
const JUNIOR=['ม.1','ม.2','ม.3'];
const LEVELS=['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'];
const charts={};
const PG={};

const toast=(icon,title)=>Swal.fire({toast:true,position:'top-end',icon,title,showConfirmButton:false,timer:2400,timerProgressBar:true});
const alertOk=(title,text)=>Swal.fire({icon:'success',title,text,confirmButtonColor:'#16a34a',confirmButtonText:'ตกลง'});
const alertErr=(title,text)=>Swal.fire({icon:'error',title,text,confirmButtonColor:'#e11d48',confirmButtonText:'ตกลง'});
async function confirmDel(text='ต้องการลบข้อมูลนี้หรือไม่?'){
  const r=await Swal.fire({icon:'warning',title:'ยืนยันการลบ',text,showCancelButton:true,confirmButtonText:'ลบข้อมูล',cancelButtonText:'ยกเลิก',confirmButtonColor:'#e11d48',cancelButtonColor:'#94a3b8'});
  return r.isConfirmed;
}
async function confirmAction({title,text,html,confirmText='ยืนยัน',icon='question',color='#16a34a'}){
  const r=await Swal.fire({icon,title,text,html,showCancelButton:true,confirmButtonText:confirmText,cancelButtonText:'ยกเลิก',confirmButtonColor:color,cancelButtonColor:'#94a3b8',reverseButtons:true});
  return r.isConfirmed;

function showLoader(t='กำลังโหลด...'){ $('#loaderText').textContent=t; const l=$('#loader'); l.classList.remove('hidden'); l.classList.add('flex'); }
function hideLoader(){ const l=$('#loader'); l.classList.add('hidden'); l.classList.remove('flex'); }
function fileToB64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ')); r.readAsDataURL(file); });
}
function resizeImage(file,max=600){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/png'));
    };
    img.onerror=()=>rej(new Error('ไม่สามารถอ่านไฟล์รูปภาพได้'));
    img.src=url;
  });
}

/* =========================================================
   API (Google Apps Script Web App)
========================================================= */
async function api(action,data={}){
  if(!API_URL||API_URL.includes('PASTE_YOUR')) throw new Error('ยังไม่ได้ตั้งค่า API_URL ใน index.html');
  const body=JSON.stringify({action,token:SESSION?.token,...data});
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),120000);
  let res;
  try{
    res=await fetch(API_URL,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctrl.signal});
  }catch(e){
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต หรือ URL ของ Web App');
  }finally{ clearTimeout(to); }
  let j;
  try{ j=await res.json(); }
  catch(e){ throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจสอบว่า Deploy เป็น "ผู้มีสิทธิ์เข้าถึง: ทุกคน"'); }
  if(!j.ok){
    const err=new Error(j.error||'เกิดข้อผิดพลาด'); err.code=j.code;
    if(j.code==='AUTH') handleAuthExpired();
    throw err;
  }
  return j;
}
function handleAuthExpired(){
  if(!SESSION) return;
  SESSION=null; persistSession(); DB=emptyDB();
  clearTimeout(syncTimer); setSyncState('ok');
  applyTheme(); renderAuth(); renderNav();
  go('home');
  setTimeout(()=>{ toast('warning','หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่'); openLogin(); },300);
}

/* =========================================================
   MODAL
========================================================= */
let modalEl=null;
function modal({title,body,size='max-w-lg',okText='บันทึก',busyText='กำลังบันทึก',hideOk=false,onOk}){
  closeModal();
  modalEl=document.createElement('div');
  modalEl.className='fixed inset-0 z-[60] flex items-start justify-center p-3 sm:p-6 overflow-y-auto bg-slate-900/50 backdrop-blur-sm';
  modalEl.innerHTML=`
    <div class="w-full ${size} bg-white rounded-2xl shadow-2xl my-4 animate-pop">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
        <h3 class="font-bold text-slate-800 text-[15px]">${title}</h3>
        <button class="btn-icon" data-close><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 max-h-[70vh] overflow-y-auto scrollbar" data-body>${body}</div>
      <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2">
        <button class="btn btn-ghost" data-close>ยกเลิก</button>
        ${hideOk?'':'<button class="btn btn-primary" data-ok>'+okText+'</button>'}
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  document.body.style.overflow='hidden';
  modalEl.addEventListener('click',async e=>{
    if(e.target===modalEl||e.target.closest('[data-close]')) return closeModal();
    const ok=e.target.closest('[data-ok]');
    if(ok){
      ok.disabled=true;
      const old=ok.innerHTML;
      ok.innerHTML='<i class="fa-solid fa-circle-notch spin"></i> '+busyText;
      try{
        const res=await onOk?.();
        if(res===false){ ok.disabled=false; ok.innerHTML=old; }
        else closeModal();
      }catch(err){ console.error(err); ok.disabled=false; ok.innerHTML=old; alertErr('เกิดข้อผิดพลาด',String(err.message||err)); }
    }
  });
}
function closeModal(){
  if(modalEl){ modalEl.remove(); modalEl=null; document.body.style.overflow=''; }
}

function seedDefaults(){
  let ch=false;
  if(!DB.topics.junior.length && !DB.topics.senior.length){ DB.topics={junior:seedJunior(),senior:seedSenior()}; ch=true; }
  if(!DB.subjectGroups.length){
    DB.subjectGroups=['คณิตศาสตร์','วิทยาศาสตร์และเทคโนโลยี','ภาษาไทย','ภาษาต่างประเทศ','สังคมศึกษา ศาสนาและวัฒนธรรม','สุขศึกษาและพลศึกษา','ศิลปะ','การงานอาชีพ'].map(n=>({id:uid(),name:n}));
    ch=true;
  }
  if(!DB.semesters.length){
    const d=new Date(), m=d.getMonth(), y=d.getFullYear()+543;
    DB.semesters=[{id:uid(),term:(m>=4&&m<=9)?1:2,year:m>=4?y:y-1,current:true}];
    ch=true;
  }
  return ch;
}

/* ---------- SYNC ---------- */
const SYNC_TABLES=['semesters','subjectGroups','subjects','classes','students','assignments','topics','settings'];
let SNAP={}, SNAP_EV={}, syncTimer=null, syncing=false, syncAgain=false, ACT_QUEUE=[], REPORT_AIDS=new Set(), LAST_ERR='', SYNC_STATE='ok';

function snapshot(){
  SYNC_TABLES.forEach(t=>SNAP[t]=JSON.stringify(DB[t]));
  SNAP_EV={}; Object.keys(DB.evals).forEach(a=>SNAP_EV[a]=JSON.stringify(DB.evals[a]));
}
function saveDB(o={}){
  if(!SESSION) return;
  setSyncState('dirty');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(flushSync,o.now?50:1500);
}
async function syncNow(){
  clearTimeout(syncTimer);
  while(syncing) await sleep(150);
  return flushSync();
}
async function flushSync(){
  if(!SESSION) return true;
  if(syncing){ syncAgain=true; return true; }
  const tables={},evals={},sentT={},sentE={};
  if(SESSION.role==='admin') SYNC_TABLES.forEach(t=>{ const s=JSON.stringify(DB[t]); if(s!==SNAP[t]){ tables[t]=DB[t]; sentT[t]=s; } });
  Object.keys(DB.evals).forEach(a=>{ const s=JSON.stringify(DB.evals[a]); if(s!==SNAP_EV[a]){ evals[a]=DB.evals[a]; sentE[a]=s; } });
  const acts=ACT_QUEUE.splice(0), reps=[...REPORT_AIDS]; REPORT_AIDS.clear();
  if(!Object.keys(tables).length && !Object.keys(evals).length && !acts.length && !reps.length){ setSyncState('ok'); return true; }
  syncing=true; setSyncState('saving');
  let ok=true;
  try{
    await api('sync',{tables,evals,activity:acts,reportFor:reps});
    Object.assign(SNAP,sentT); Object.assign(SNAP_EV,sentE); LAST_ERR='';
  }catch(err){
    ok=false; LAST_ERR=err.message;
    console.error('sync error:',err);
    if(!window.__errShown){
      window.__errShown=true;
      alertErr('บันทึกข้อมูลไม่สำเร็จ',err.message);
      setTimeout(()=>{window.__errShown=false;},30000);
    }
    ACT_QUEUE.unshift(...acts); reps.forEach(x=>REPORT_AIDS.add(x));
    if(SESSION){ setSyncState('error',err.message); clearTimeout(syncTimer); syncTimer=setTimeout(flushSync,10000); }
  }finally{ syncing=false; }
  if(ok){
    if(syncAgain){ syncAgain=false; return flushSync(); }
    setSyncState('ok');
  }
  syncAgain=false;
  return ok;
}
function setSyncState(s,msg){
  SYNC_STATE=s;
  const b=$('#syncBox'); if(!b) return;
  if(!SESSION){ b.innerHTML=''; return; }
  const m={
    ok:['bg-emerald-50 text-emerald-700','fa-cloud-arrow-up','บันทึกลงฐานข้อมูลแล้ว'],
    dirty:['bg-amber-50 text-amber-700','fa-pen','รอการบันทึก'],
    saving:['bg-sky-50 text-sky-700','fa-circle-notch spin','กำลังบันทึก'],
    error:['bg-rose-50 text-rose-700','fa-triangle-exclamation','บันทึกไม่สำเร็จ (กำลังลองใหม่)']
  }[s];
  b.innerHTML=`<span class="sync-pill ${m[0]}" title="${esc(msg||'')}"><i class="fa-solid ${m[1]}"></i><span class="hidden md:inline">${m[2]}</span></span>`;
}
window.addEventListener('beforeunload',e=>{
  if(SESSION && (SYNC_STATE==='dirty'||SYNC_STATE==='saving'||SYNC_STATE==='error')){ e.preventDefault(); e.returnValue=''; }
});

function applyTheme(){
  const s=DB.settings||{};
  const root=document.documentElement.style;
  root.setProperty('--primary',s.primary||'#16a34a');
  root.setProperty('--primary-d',shade(s.primary||'#16a34a',-18));
  root.setProperty('--primary-s',shade(s.primary||'#16a34a',85));
  root.setProperty('--accent',s.accent||'#facc15');
  root.setProperty('--accent-s',shade(s.accent||'#facc15',80));
  renderLogo();
}
function shade(hex,pct){
  const h=hex.replace('#','');
  const num=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  const f=v=>{ const n=pct<0? v*(100+pct)/100 : v+(255-v)*pct/100; return Math.max(0,Math.min(255,Math.round(n))); };
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  const box=$('#logoBox'); if(!box) return;

function qualityOf(avg){
  if(avg===null||avg===undefined||isNaN(avg)) return {level:null,label:'ยังไม่มีข้อมูล',cls:'bg-slate-100 text-slate-500'};
  if(avg>=2.5) return {level:3,label:'ดีเยี่ยม',cls:'bg-emerald-100 text-emerald-700'};
  if(avg>=1.5) return {level:2,label:'ดี',cls:'bg-sky-100 text-sky-700'};
  if(avg>=0.5) return {level:1,label:'พอใช้/ผ่านเกณฑ์',cls:'bg-amber-100 text-amber-700'};
  return {level:0,label:'ปรับปรุง',cls:'bg-rose-100 text-rose-700'};
}
function qBadge(avg){
  const q=qualityOf(avg);
  if(q.level===null) return `<span class="badge ${q.cls}">— ยังไม่มีข้อมูล</span>`;
  return `<span class="badge ${q.cls}"><b>${q.level}</b> ${q.label}</span>`;
}
function classOf(id){ return DB.classes.find(c=>c.id===id); }
function groupOfLevel(l){ return JUNIOR.includes(l)?'junior':'senior'; }
function groupOfClass(c){ return c?groupOfLevel(c.level):'junior'; }
function assignGroup(a){ return groupOfClass(classOf(a.classId)); }
function studentsOf(classId){ return DB.students.filter(s=>s.classId===classId).sort((a,b)=>(a.no||0)-(b.no||0)); }
function semLabel(s){ return s?`ภาคเรียนที่ ${s.term}/${s.year}`:'-'; }
function currentSem(){ return DB.semesters.find(s=>s.current)||DB.semesters[0]||null; }

function flattenLeaves(node,prefix='',out=[]){
  const kids=node.children||[];
  if(!kids.length){ out.push({node,code:prefix||'•'}); return out; }
  kids.forEach((c,i)=>{
    const code=prefix?`${prefix}.${i+1}`:String(i+1);
    flattenLeaves(c,code,out);
  });
  return out;
}
/* เหมือน flattenLeaves แต่เก็บ "บรรพบุรุษ" ของแต่ละข้อไว้ด้วย เพื่อทำหัวตารางหลายชั้น */
function leavesWithPath(node,prefix='',path=[],out=[]){
  const kids=node.children||[];
  if(!kids.length){ out.push({node,code:prefix||'•',anc:path.slice(0,-1)}); return out; }
  kids.forEach((c,i)=>leavesWithPath(c,prefix?`${prefix}.${i+1}`:String(i+1),[...path,c],out));
  return out;
}
function allLeavesOf(group){
  const out=[];
  (DB.topics[group]||[]).forEach(t=>flattenLeaves(t,'',out));
  return out;
}
function nodeAvg(node,scores){
  const kids=node.children||[];
  if(!kids.length){
    const v=scores[node.id];
    return (v===undefined||v===null||v==='')?null:Number(v);
  }
  const vals=kids.map(c=>nodeAvg(c,scores)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function setScore(assignId,studentId,topicId,val){
  if(!DB.evals[assignId]) DB.evals[assignId]={};
  if(!DB.evals[assignId][studentId]) DB.evals[assignId][studentId]={};
  if(val===null||val===undefined||val==='') delete DB.evals[assignId][studentId][topicId];
  else DB.evals[assignId][studentId][topicId]=Number(val);
}
function getScore(assignId,studentId,topicId){
  const v=DB.evals?.[assignId]?.[studentId]?.[topicId];
  return (v===undefined)?null:v;
}
function studentAssignAvg(assignId,studentId){
  const a=DB.assignments.find(x=>x.id===assignId); if(!a) return null;
  const g=assignGroup(a);
  const scores=DB.evals?.[assignId]?.[studentId]||{};
  const tops=DB.topics[g]||[];
  const vals=tops.map(t=>nodeAvg(t,scores)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((x,y)=>x+y,0)/vals.length;
}
function collectStats(semId){
  const res={all:[],junior:[],senior:[],levels:{},classes:{},perAssign:{}};
  const assigns=DB.assignments.filter(a=>a.semesterId===semId);
  for(const a of assigns){
    const cls=classOf(a.classId); if(!cls) continue;
    const g=groupOfClass(cls);
    const arr=[];
    for(const st of studentsOf(cls.id)){
      const avg=studentAssignAvg(a.id,st.id);
      if(avg===null) continue;
      res.all.push(avg); res[g].push(avg); arr.push(avg);
      (res.levels[cls.level]=res.levels[cls.level]||[]).push(avg);
      (res.classes[cls.id]=res.classes[cls.id]||[]).push(avg);
    }
    res.perAssign[a.id]=arr;
  }
  return res;
}
function logAct(text){
  DB.activity.unshift({id:uid(),ts:Date.now(),text,user:SESSION?.name||'ระบบ'});
  DB.activity=DB.activity.slice(0,300);

}
function opts(list,sel,valFn=x=>x.id,lblFn=x=>x.name){

function pagerHTML(key,info){
  if(info.totalPages<=1) return '';
  const nums=[];
  for(let i=0;i<info.totalPages;i++){
    if(info.totalPages>9 && Math.abs(i-info.page)>2 && i!==0 && i!==info.totalPages-1){ if(i===1||i===info.totalPages-2) nums.push('<span class="px-1 text-slate-400">…</span>'); continue; }
    nums.push(`<button class="w-8 h-8 rounded-lg text-xs font-bold ${i===info.page?'text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}" ${i===info.page?'style="background:var(--primary)"':''} data-pgkey="${key}" data-pgto="${i}">${i+1}</button>`);
  }
  return `<div class="flex flex-wrap items-center justify-between gap-2 pt-3">
    <p class="text-xs text-slate-500">ทั้งหมด ${info.total} รายการ</p>
    <div class="flex items-center gap-1">
      <button class="btn btn-ghost btn-xs" data-pgkey="${key}" data-pgto="prev" ${info.page===0?'disabled style="opacity:.4"':''}><i class="fa-solid fa-chevron-left"></i></button>
      ${nums.join('')}
      <button class="btn btn-ghost btn-xs" data-pgkey="${key}" data-pgto="next" ${info.page>=info.totalPages-1?'disabled style="opacity:.4"':''}><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>`;
}
function slicePage(arr,key,size=10){
  const st=PG[key]||(PG[key]={p:0});
  const totalPages=Math.max(1,Math.ceil(arr.length/size));
  if(st.p>=totalPages) st.p=totalPages-1;
  if(st.p<0) st.p=0;
  const start=st.p*size;
  return {items:arr.slice(start,start+size),start,page:st.p,totalPages,total:arr.length};
}

        if(!lines.length){ alertErr('ไม่มีข้อมูล','กรุณากรอกรายชื่อ'); return false; }
        let no=(studentsOf(c.id).reduce((m,s)=>Math.max(m,s.no||0),0));

      Swal.fire({title:'กำลังนำเข้าข้อมูล...',didOpen:()=>Swal.showLoading(),allowOutsideClick:false});
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
      let added=0, no=studentsOf(c.id).reduce((m,s)=>Math.max(m,s.no||0),0);

        if(cells.some(x=>/ชื่อ|นามสกุล|name/i.test(x)) && cells.length<=3) return;
        let n=null,num=null;
        if(/^\d+$/.test(cells[0])){ num=Number(cells[0]); n=cells.slice(1).join(' ').trim(); }

        added++;
      });
      Swal.close();
      e.target.value='';

      logAct(`นำเข้านักเรียน ${added} คน ใน ${c.name}`); saveDB(); go('students',{classId:c.id});
      alertOk('นำเข้าสำเร็จ',`เพิ่มนักเรียน ${added} รายชื่อ`);
      // สำรองไฟล์ Excel ลง Google Drive (โฟลเดอร์ที่กำหนด)
      fileToB64(f).then(b64=>api('uploadFile',{kind:'import',name:`${c.name}_${f.name}`,mime:f.type||'application/octet-stream',data:b64}))
        .then(()=>toast('success','สำรองไฟล์ Excel ลง Google Drive แล้ว'))
        .catch(()=>toast('warning','สำรองไฟล์ลง Google Drive ไม่สำเร็จ'));
    }catch(err){ Swal.close(); alertErr('เกิดข้อผิดพลาด',String(err.message||err)); }
  };
}

function assignProgress(assignId){
  const a=DB.assignments.find(x=>x.id===assignId); if(!a) return {pct:0};
  const sts=studentsOf(a.classId);
  const leaves=allLeavesOf(assignGroup(a));
  const total=sts.length*leaves.length;
  if(!total) return {pct:0};
  let done=0;
  sts.forEach(s=>leaves.forEach(l=>{ if(getScore(a.id,s.id,l.node.id)!==null) done++; }));
  return {pct:Math.round(done/total*100),done,total};
}

function findNode(list,id){
  for(const n of list){
    if(n.id===id) return n;
    const f=findNode(n.children||[],id);
    if(f) return f;
  }
  return null;
}
function nodeLevel(list,id,lvl=1){
  for(const n of list){
    if(n.id===id) return lvl;
    const r=nodeLevel(n.children||[],id,lvl+1);
    if(r) return r;
  }
  return 0;
}
function removeNode(list,id){
  for(let i=0;i<list.length;i++){
    if(list[i].id===id){ list.splice(i,1); return true; }
    if(removeNode(list[i].children||[],id)) return true;
  }
  return false;
}
function topicNodeHTML(n,lvl,g){
  const colors=['','bg-emerald-50 text-emerald-700','bg-sky-50 text-sky-700','bg-amber-50 text-amber-700','bg-violet-50 text-violet-700','bg-rose-50 text-rose-700'];
  return `<div class="tl-row" style="margin-left:${(lvl-1)*18}px">
    <span class="badge ${colors[lvl]} shrink-0 mt-0.5">ระดับ ${lvl}</span>
    <div class="flex-1 min-w-0">

      </div>
    </div>
  </div>${(n.children||[]).map(c=>topicNodeHTML(c,lvl+1,g)).join('')}`;
}

                  <td>${vals.length}</td>
                  <td class="font-bold" style="color:var(--primary-d)">${fmt(av)}</td>
                  <td>${qBadge(av)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join(''):'<div class="card p-8 text-center text-slate-400">ไม่พบข้อมูลการประเมินในภาคเรียนนี้</div>'}
  </div>`;
  $('#rSem').onchange=e=>{RES.semId=e.target.value;go('results');};
}

const EV={semId:null,assignId:'',topId:'',checks:new Set()};
let EVC=null;
const GRP_BG=['#d1fae5','#dbeafe','#fef3c7','#ede9fe'];
const GRP_FG=['#065f46','#1e3a8a','#78350f','#4c1d95'];

        <select id="evAsg" class="inp">${inSem.map(a=>{
          const sub=DB.subjects.find(s=>s.id===a.subjectId), c=classOf(a.classId);
          return `<option value="${a.id}" ${EV.assignId===a.id?'selected':''}>${esc(sub?.name||'-')} — ${esc(c?.name||'-')}</option>`;
        }).join('')||'<option value="">-- ไม่มีรายวิชาที่มอบหมาย --</option>'}</select></div>
    </div>

    ${assign?evalMatrixHTML(assign):'<div class="card p-10 text-center text-slate-400"><i class="fa-solid fa-inbox text-3xl mb-2 block"></i>ยังไม่มีรายวิชาที่ได้รับมอบหมายในภาคเรียนนี้</div>'}

function fullCode(rootNo,code){ return code==='•'?String(rootNo):`${rootNo}.${code}`; }
function topProgress(assign,leaves,sid){
  let done=0; leaves.forEach(l=>{ if(getScore(assign.id,sid,l.node.id)!==null) done++; });
  return {done,total:leaves.length};
}
function subLineHTML(assign,leaves,sid){
  const p=topProgress(assign,leaves,sid);
  return p.done<p.total
    ? `<i class="fa-solid fa-triangle-exclamation"></i> ด้านนี้ยังไม่ได้ประเมิน ${p.total-p.done} ข้อ`
    : `<i class="fa-solid fa-circle-check"></i> ด้านนี้ประเมินครบทุกข้อ`;
}
function subLineClass(assign,leaves,sid){
  const p=topProgress(assign,leaves,sid);
  return `text-[11px] font-semibold ${p.done<p.total?'text-amber-600':'text-emerald-600'}`;
}
function summaryHTML(assign,top,sid){
  const sc=DB.evals?.[assign.id]?.[sid]||{};
  const a=nodeAvg(top,sc), all=studentAssignAvg(assign.id,sid);
  const q = qualityOf(a);
  const badgeCls = q.level!==null ? q.cls : 'bg-slate-100 text-slate-500';
  const badgeTxt = q.level!==null ? q.label : '—';
  
  return `<div class="flex flex-col items-center gap-0.5" style="line-height:1.1">
    <span class="font-extrabold text-[13px]" style="color:var(--primary-d)">${fmt(a)}</span>
    <span class="badge ${badgeCls}" style="font-size:9px;padding:0.1rem 0.3rem">${badgeTxt}</span>
    <span class="text-[9px] text-slate-400">รวม ${fmt(all)}</span>
  </div>`;
}
function classAvgHTML(assign,sts){
  const av=mean(sts.map(s=>studentAssignAvg(assign.id,s.id)).filter(v=>v!==null));
  return `<span class="text-xl font-extrabold" style="color:var(--primary-d)">${fmt(av)}</span> ${qBadge(av)}`;
}

function evalMatrixHTML(assign){
  const group=assignGroup(assign);
  const tops=DB.topics[group]||[];
  const top=tops.find(t=>t.id===EV.topId)||tops[0];
  if(!top) return '<div class="card p-8 text-center text-slate-400">ยังไม่มีหัวข้อประเมิน</div>';
  EV.topId=top.id;
  const rootNo=tops.indexOf(top)+1;
  const L=leavesWithPath(top);
  const sts=studentsOf(assign.classId);
  const cls=classOf(assign.classId);
  const sub=DB.subjects.find(s=>s.id===assign.subjectId);
  const leaves=L.map(x=>({node:x.node,code:x.code}));

  const chips=tops.map((t,i)=>`<button class="chip-top ${t.id===top.id?'on':''}" data-top="${t.id}"><span>${esc(t.name)}</span></button>`).join('');

  let lastAnc=[], legend='';
  L.forEach(l=>{
    l.anc.forEach((a,k)=>{
      if(lastAnc[k]?.id!==a.id){ lastAnc=lastAnc.slice(0,k); lastAnc[k]=a; legend+=`<div class="lg-h" style="margin-left:${k*10}px">${esc(a.name)}</div>`; }
    });
    lastAnc=lastAnc.slice(0,l.anc.length);
    const done=sts.length>0&&sts.every(s=>getScore(assign.id,s.id,l.node.id)!==null);
    legend+=`<div class="lg-i ${done?'ok':''}" style="margin-left:${l.anc.length*10}px">
      <span class="evcode">${fullCode(rootNo,l.code)}</span>
      <span class="flex-1">${esc(l.node.name)}</span>
      ${done?'<i class="fa-solid fa-circle-check text-emerald-500 text-xs mt-1"></i>':''}
    </div>`;
  });

  const maxA=Math.max(0,...L.map(l=>l.anc.length));
  const R=maxA+1;
  const hdrRows=[];
  for(let k=0;k<maxA;k++){
    let cells='', i=0;
    while(i<L.length){
      const n=L[i].anc[k]; let j=i+1;
      while(j<L.length && L[j].anc[k]?.id===n?.id) j++;
      cells+= n
        ? `<th colspan="${j-i}" class="evg" style="background:${GRP_BG[k%4]};color:${GRP_FG[k%4]};font-size:.75rem;padding:.3rem .2rem">${esc(n.name)}</th>`
        : `<th colspan="${j-i}" class="evg" style="background:#f1f5f9"></th>`;
      i=j;
    }
    hdrRows.push(cells);
  }
  
  hdrRows.push(L.map(l=>`<th class="evl" style="min-width:65px;padding:0.3rem 0.2rem" title="${esc(l.node.name)}"><span class="evcode" style="font-size:.7rem;padding:0.1rem 0.3rem">${fullCode(rootNo,l.code)}</span><div class="evtxt" style="font-size:.75rem;margin-top:0.2rem;line-height:1.2">${esc(l.node.name)}</div></th>`).join(''));

  // ใช้คลาส CSS แทน inline style เพื่อให้ Responsive
  const fixedTh=`
    <th rowspan="${R}" class="evf col-chk" style="padding:0.2rem"></th>
    <th rowspan="${R}" class="evf col-no" style="padding:0.2rem;text-align:center">เลขที่</th>
    <th rowspan="${R}" class="evf col-name" style="padding:0.2rem">ชื่อ-นามสกุล</th>
    <th rowspan="${R}" class="evf col-sum" style="padding:0.2rem;text-align:center">สรุป</th>
    <th rowspan="${R}" class="evf col-set" style="padding:0.2rem">ตั้งค่า</th>`;
    
  const thead=hdrRows.map((c,i)=>`<tr>${i===0?fixedTh:''}${c}</tr>`).join('');

  const rows=sts.map(st=>{
    return `<tr data-row="${st.id}">
      <td class="stk col-chk" style="padding:0.2rem"><div class="flex justify-center"><input type="checkbox" class="w-4 h-4 accent-green-600 ev-chk" data-sid="${st.id}" ${EV.checks.has(st.id)?'checked':''}></div></td>
      <td class="stk col-no text-center font-semibold text-slate-600" style="padding:0.2rem">${st.no||'-'}</td>
      <td class="stk col-name" style="padding:0.2rem 0.4rem">
        <p class="font-bold text-[13px] leading-tight text-slate-800 break-words" style="word-break:break-word">${esc(st.name)}</p>
        <p data-sub="${st.id}" class="${subLineClass(assign,leaves,st.id)}" style="font-size:10px;line-height:1.2">${subLineHTML(assign,leaves,st.id)}</p>
      </td>
      <td class="col-sum text-center" data-summary="${st.id}" style="padding:0.2rem">${summaryHTML(assign,top,st.id)}</td>
      <td class="col-set whitespace-nowrap" style="padding:0.2rem">
        <div class="grid grid-cols-2 gap-1 justify-center">
          ${[3,2,1,0].map(v=>`<button class="btn btn-xs !px-1 !py-1 s${v}" data-rowset="${st.id}" data-v="${v}" title="ตั้งค่าทั้งแถว = ${v}" style="font-size:10px">${v}</button>`).join('')}
        </div>
      </td>
      ${leaves.map(l=>{
        const v=getScore(assign.id,st.id,l.node.id);
        return `<td class="text-center" style="min-width:55px; padding:0.25rem"><select class="score-sel ${v===null?'sn':'s'+v}" data-a="${assign.id}" data-s="${st.id}" data-t="${l.node.id}" aria-label="${esc(fullCode(rootNo,l.code))}">
          <option value="" ${v===null?'selected':''}>–</option>
          ${[3,2,1,0].map(x=>`<option value="${x}" ${v===x?'selected':''}>${x}</option>`).join('')}
        </select></td>`;
      }).join('')}
    </tr>`;
  }).join('');

  return `<div class="space-y-4">
    <div class="card p-4">
      <p class="lbl !text-[12px] !mb-2"><i class="fa-solid fa-list-check mr-1" style="color:var(--primary)"></i> เลือกด้านที่ประเมิน (${tops.length} ด้าน)</p>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">${chips}</div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-4">
      <div class="card p-3 xl:col-span-1 self-start">
        <p class="font-bold text-sm text-slate-800 mb-2"><i class="fa-solid fa-list-ul mr-1" style="color:var(--primary)"></i> หัวข้อที่ประเมินในด้านนี้ (${leaves.length} ข้อ)</p>
        <div class="max-h-[30rem] overflow-y-auto scrollbar mb-3 pr-1">${legend}</div>
        <div class="text-[12px] bg-slate-50 rounded-lg p-3 space-y-1.5">
          <p class="font-bold text-slate-700 mb-1">ข้อมูลการประเมิน</p>
          <p class="text-slate-600"><i class="fa-solid fa-book mr-1.5"></i>${esc(sub?.name||'-')}</p>
          <p class="text-slate-600"><i class="fa-solid fa-school mr-1.5"></i>${esc(cls?.name||'-')} (${esc(cls?.level||'-')})</p>
          <p class="text-slate-600"><i class="fa-solid fa-layer-group mr-1.5"></i>${group==='junior'?'สมรรถนะ ม.ต้น':'สมรรถนะ ม.ปลาย'}</p>
          <p class="text-slate-600"><i class="fa-solid fa-users mr-1.5"></i>นักเรียน ${sts.length} คน</p>
        </div>
      </div>

      <div class="xl:col-span-3 space-y-3 min-w-0">
        <div class="rounded-2xl p-4" style="background:var(--primary-s);border:1.5px solid var(--primary)">
          <p class="text-[12px] font-bold" style="color:var(--primary-d)">ด้านที่ประเมิน — ด้านที่ ${rootNo}</p>
          <h3 class="text-lg font-extrabold text-slate-900 leading-snug">${esc(top.name)}</h3>
          <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
            <span class="text-xs font-bold text-slate-700 mr-1">ระดับคุณภาพ:</span>
            <span class="badge s3 !text-xs">3 ดีเยี่ยม</span><span class="badge s2 !text-xs">2 ดี</span><span class="badge s1 !text-xs">1 พอใช้/ผ่านเกณฑ์</span><span class="badge s0 !text-xs">0 ปรับปรุง</span>
          </div>
        </div>

        <div class="card p-3 flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold text-slate-700 mr-1">เฉพาะคนที่เลือก:</span>
          ${[3,2,1,0].map(v=>`<button class="btn btn-xs s${v}" data-selall="${v}">ระดับ ${v}</button>`).join('')}
          <span class="text-xs text-slate-300">|</span>
          <span class="text-xs font-bold text-slate-700">ทั้งห้อง:</span>
          ${[3,2,1,0].map(v=>`<button class="btn btn-xs btn-ghost" data-all="${v}">${v} ทั้งห้อง</button>`).join('')}
          <span class="ml-auto text-xs text-slate-500" id="chkCount">เลือก 0 คน</span>
        </div>

        <div class="card p-3">
          <!-- เปลี่ยนมาใช้ table-responsive เพื่อรองรับการปัดจอซ้าย-ขวาบนมือถือ -->
          <div class="table-responsive" style="max-height:78vh;">
            <table class="evt" id="evTable">
              <thead>${thead}</thead>
              <tbody>${rows||`<tr><td colspan="${5+leaves.length}" class="text-center text-slate-400 py-8">ยังไม่มีนักเรียนในชั้นนี้</td></tr>`}</tbody>
            </table>
          </div>
        </div>

        <div class="card p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-500">ภาพรวมห้องนี้ (ทุกด้าน):</span>
            <span id="classAvgBox">${classAvgHTML(assign,sts)}</span>
          </div>
          <button class="btn btn-primary" id="btnSaveEval"><i class="fa-solid fa-floppy-disk"></i> บันทึกการประเมิน</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* เปลี่ยนคะแนนจาก dropdown (ผูกครั้งเดียว) */
document.addEventListener('change',e=>{
  const sel=e.target.closest?.('.score-sel');
  if(!sel||!EVC) return;
  const {a,s,t}=sel.dataset;
  setScore(a,s,t,sel.value===''?null:Number(sel.value));
  sel.className='score-sel '+(sel.value===''?'sn':'s'+sel.value);
  saveDB(); EVC.refreshRow(s); EVC.refreshClass();
});

function bindEval(assign){
  const group=assignGroup(assign);
  const tops=DB.topics[group]||[];
  const top=tops.find(t=>t.id===EV.topId)||tops[0];
  if(!top) return;
  const rootNo=tops.indexOf(top)+1;
  const leaves=flattenLeaves(top);
  const sts=studentsOf(assign.classId);
  const cls=classOf(assign.classId);

  // ตำแหน่ง sticky ของหัวตารางหลายชั้น
  const fixHead=()=>{ let y=0; $$('#evTable thead tr').forEach(tr=>{ $$('th',tr).forEach(th=>th.style.top=y+'px'); y+=tr.offsetHeight; }); };
  fixHead(); setTimeout(fixHead,350); window.onresize=fixHead;

  const refreshRow=sid=>{
    const sub=$(`[data-sub="${sid}"]`), sum=$(`[data-summary="${sid}"]`);
    if(sub){ sub.className=subLineClass(assign,leaves,sid); sub.innerHTML=subLineHTML(assign,leaves,sid); }
    if(sum) sum.innerHTML=summaryHTML(assign,top,sid);
  };
  const refreshClass=()=>{ const b=$('#classAvgBox'); if(b) b.innerHTML=classAvgHTML(assign,sts); };
  EVC={refreshRow,refreshClass};

  $$('[data-top]').forEach(b=>b.onclick=()=>{ EV.topId=b.dataset.top; EV.checks.clear(); go('eval'); });

  // ตั้งค่าทั้งแถว
  $$('[data-rowset]').forEach(b=>b.onclick=()=>{
    const sid=b.dataset.rowset, v=Number(b.dataset.v);
    leaves.forEach(l=>{
      setScore(assign.id,sid,l.node.id,v);
      const sel=$(`.score-sel[data-s="${sid}"][data-t="${l.node.id}"]`);
      if(sel){ sel.value=String(v); sel.className='score-sel s'+v; }
    });
    saveDB(); refreshRow(sid); refreshClass();
    toast('success','ตั้งค่าระดับ '+v+' ทั้งแถวแล้ว');
  });

  // checkbox
  const updChk=()=>{ const n=$$('.ev-chk:checked').length; const c=$('#chkCount'); if(c) c.textContent=`เลือก ${n} คน`; };
  $$('.ev-chk').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) EV.checks.add(cb.dataset.sid); else EV.checks.delete(cb.dataset.sid);
    updChk();
  });
  updChk();

  // เฉพาะคนที่เลือก
  $$('[data-selall]').forEach(b=>b.onclick=()=>{
    const v=Number(b.dataset.selall);
    const sids=[...EV.checks];
    if(!sids.length){ alertErr('ยังไม่ได้เลือกนักเรียน','กรุณาติ๊กเลือกนักเรียนก่อน'); return; }
    sids.forEach(sid=>{
      leaves.forEach(l=>{
        setScore(assign.id,sid,l.node.id,v);
        const sel=$(`.score-sel[data-s="${sid}"][data-t="${l.node.id}"]`);
        if(sel){ sel.value=String(v); sel.className='score-sel s'+v; }
      });
      refreshRow(sid);
    });
    saveDB(); refreshClass();
    toast('success',`ตั้งค่าระดับ ${v} ให้ ${sids.length} คนแล้ว`);
  });

  // ทั้งห้อง → ยืนยันการเพิ่มข้อมูลทั้งห้อง
  $$('[data-all]').forEach(b=>b.onclick=async()=>{
    const v=Number(b.dataset.all);
    const ok=await confirmAction({
      icon:'question',
      title:'ยืนยันการเพิ่มข้อมูลทั้งห้อง',
      html:`<div style="text-align:left;line-height:1.75;font-size:.95rem">
        <b>ด้านที่ ${rootNo}:</b> ${esc(top.name)}<br>
        ตั้งค่าระดับ <b>${v}</b> ให้นักเรียนทุกคนในห้อง <b>${esc(cls?.name||'')}</b><br>
        <span style="color:#64748b">(${leaves.length} หัวข้อ × ${sts.length} คน = ${leaves.length*sts.length} รายการ)</span><br>
        <span style="color:#b45309">ค่าเดิมของด้านนี้จะถูกแทนที่ทั้งหมด</span></div>`,
      confirmText:'ยืนยันการเพิ่มข้อมูล'
    });
    if(!ok) return;
    sts.forEach(st=>leaves.forEach(l=>setScore(assign.id,st.id,l.node.id,v)));
    logAct(`ตั้งค่าระดับ ${v} ทั้งห้อง ${cls?.name||''} (ด้านที่ ${rootNo})`);
    saveDB(); go('eval'); toast('success','เพิ่มข้อมูลทั้งห้องแล้ว');
  });

  // บันทึก (ซิงก์ + สร้างรายงานรายห้อง/รายชั้นใน Google Sheets)
  const saveBtn=$('#btnSaveEval');
  if(saveBtn) saveBtn.onclick=async()=>{
    const old=saveBtn.innerHTML;
    saveBtn.innerHTML='<i class="fa-solid fa-circle-notch spin"></i> กำลังบันทึกลงฐานข้อมูล';
    saveBtn.disabled=true;
    logAct('บันทึกผลการประเมิน '+(DB.subjects.find(s=>s.id===assign.subjectId)?.name||'')+' '+(cls?.name||''));
    REPORT_AIDS.add(assign.id);
    const ok=await syncNow();
    saveBtn.innerHTML=old; saveBtn.disabled=false;
    if(ok) alertOk('บันทึกการประเมินสำเร็จ','ข้อมูลถูกบันทึกลงฐานข้อมูลและอัปเดตรายงานรายห้องแล้ว');
    else alertErr('บันทึกไม่สำเร็จ',LAST_ERR||'กรุณาลองใหม่อีกครั้ง');
  };
}

/* =========================================================
   TEACHER : ACCOUNT
========================================================= */
function pageAccount(el){
  const u=DB.users.find(x=>x.id===SESSION.id)||SESSION;
  const myAssigns=DB.assignments.filter(a=>a.teacherId===u.id);
  const sem=currentSem();
  const inSem=myAssigns.filter(a=>a.semesterId===sem?.id);
  const done=inSem.filter(a=>assignProgress(a.id).pct===100).length;

  el.innerHTML=`<div class="fade-in space-y-4 max-w-2xl">
    <div><h2 class="text-lg font-bold text-slate-800">บัญชีของฉัน</h2>
      <p class="text-xs text-slate-500">ข้อมูลส่วนตัวและความปลอดภัย</p></div>
    <div class="card p-5">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-extrabold text-white" style="background:var(--primary)">${esc(u.name.charAt(0))}</div>
        <div>
          <p class="font-bold text-slate-800 text-base">${esc(u.name)}</p>
          <p class="text-xs text-slate-500">${esc(u.position||'ครู')} · ชื่อผู้ใช้: ${esc(u.username)}</p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-4 text-center">
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${myAssigns.length}</p><p class="text-[11px] text-slate-500">รายวิชาที่สอน</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${inSem.length}</p><p class="text-[11px] text-slate-500">ภาคเรียนปัจจุบัน</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-lg font-extrabold" style="color:var(--primary-d)">${done}</p><p class="text-[11px] text-slate-500">ประเมินครบแล้ว</p></div>
      </div>
    </div>
    <div class="card p-5">
      <h3 class="font-bold text-sm text-slate-700 mb-3"><i class="fa-solid fa-key mr-1" style="color:var(--accent)"></i> เปลี่ยนรหัสผ่าน</h3>
      <div class="space-y-3">
        <div><label class="lbl">รหัสผ่านเดิม</label><input id="op" type="password" class="inp" autocomplete="current-password"></div>
        <div><label class="lbl">รหัสผ่านใหม่</label><input id="npw" type="password" class="inp" autocomplete="new-password"></div>
        <div><label class="lbl">ยืนยันรหัสผ่านใหม่</label><input id="cpw" type="password" class="inp" autocomplete="new-password"></div>
        <button class="btn btn-primary" id="chgPass"><i class="fa-solid fa-floppy-disk"></i> เปลี่ยนรหัสผ่าน</button>
      </div>
    </div>
  </div>`;
  $('#chgPass').onclick=async()=>{
    const o=$('#op').value, n=$('#npw').value, c=$('#cpw').value;
    if(!o){ alertErr('กรุณากรอกรหัสผ่านเดิม'); return; }
    if(n.length<4){ alertErr('รหัสผ่านสั้นเกินไป','อย่างน้อย 4 ตัวอักษร'); return; }
    if(n!==c){ alertErr('รหัสผ่านใหม่ไม่ตรงกัน'); return; }
    const btn=$('#chgPass'); btn.disabled=true;
    try{
      await api('changePassword',{oldPassword:o,newPassword:n});
      alertOk('เปลี่ยนรหัสผ่านสำเร็จ');
      $('#op').value=$('#npw').value=$('#cpw').value='';
    }catch(err){ alertErr('เปลี่ยนรหัสผ่านไม่สำเร็จ',err.message); }
    btn.disabled=false;
  };
}

(async function init(){
  applyTheme(); renderAuth(); renderNav();
  if(!API_URL||API_URL.includes('PASTE_YOUR')){
    $('#app').innerHTML=`<div class="card p-6 max-w-xl mx-auto text-center">
      <i class="fa-solid fa-plug-circle-exclamation text-3xl text-amber-500 mb-2"></i>
      <h2 class="font-bold text-slate-800">ยังไม่ได้ตั้งค่าการเชื่อมต่อฐานข้อมูล</h2>
      <p class="text-sm text-slate-500 mt-2">เปิดไฟล์ <b>index.html</b> แล้วแก้ค่า <code>API_URL</code> ให้เป็น URL ของ Web App (Apps Script) ที่ลงท้ายด้วย <code>/exec</code></p></div>`;
    return;
  }
  loadSession();
  if(SESSION){
    try{ await loadAll(); go('home'); }
    catch(err){
      console.error(err);
      if(err.code!=='AUTH'){ SESSION=null; persistSession(); renderAuth(); renderNav(); alertErr('โหลดข้อมูลไม่สำเร็จ',err.message); go('home'); }
    }
  }else{
    go('home');
    loadPublicInfo();
  }
})();
